# infrastructure/local/docker-compose.yml
services:
  # PostgreSQL for document metadata
  postgres:
    image: postgres:15-alpine
    container_name: voice-doc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voicedoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicedoc123}
      POSTGRES_DB: ${POSTGRES_DB:-voice_doc_intel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Host port 5433 → container 5432 (5432 is taken by another project locally)
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicedoc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and real-time features
  redis-stack:
    image: redis/redis-stack:latest
    container_name: voice-doc-redis
    ports:
      # Host 6380/8002 → container 6379/8001 (6379/8001 taken by other local projects)
      - "6380:6379"
      - "8002:8001"  # RedisInsight
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:-voicedoc123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-voicedoc123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant for vector storage
  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice-doc-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      # Qdrant image has bash but no wget/curl — use bash TCP /dev/tcp probe
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: voice-doc-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voicedoc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voicedoc123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiveKit server for voice
  livekit:
    image: livekit/livekit-server:latest
    container_name: voice-doc-livekit
    command: --config /etc/livekit.yaml --node-ip=127.0.0.1
    restart: unless-stopped
    ports:
      - "7880:7880"  # HTTP
      - "7881:7881"  # RTC/TCP
      # UDP ports removed to avoid conflicts - using TURN relay instead for local dev
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    healthcheck:
      # LiveKit image has no curl/wget/bash — busybox nc -z is available
      test: ["CMD", "nc", "-z", "127.0.0.1", "7880"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal for workflow orchestration — DISABLED.
  # Was scaffolded in Phase 0 but never wired into the application
  # (no temporalio imports in apps/). Re-enable by uncommenting + fixing
  # the DB driver value (use `postgres12`, not `postgresql`).
  #
  # temporal:
  #   image: temporalio/auto-setup:latest
  #   container_name: voice-doc-temporal
  #   depends_on:
  #     - postgres
  #   environment:
  #     - DB=postgres12
  #     - DB_PORT=5432
  #     - POSTGRES_USER=${POSTGRES_USER:-voicedoc}
  #     - POSTGRES_PWD=${POSTGRES_PASSWORD:-voicedoc123}
  #     - POSTGRES_SEEDS=postgres
  #     - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
  #   ports:
  #     - "7233:7233"
  #   volumes:
  #     - temporal_data:/etc/temporal
  #
  # temporal-ui:
  #   image: temporalio/ui:latest
  #   container_name: voice-doc-temporal-ui
  #   depends_on:
  #     - temporal
  #   environment:
  #     - TEMPORAL_ADDRESS=temporal:7233
  #     - TEMPORAL_CORS_ORIGINS=http://localhost:3000
  #   ports:
  #     - "8080:8080"

  # Neo4j for knowledge graph (entity relationships + multi-hop traversal)
  neo4j:
    image: neo4j:5-community
    container_name: voice-doc-neo4j
    ports:
      - "7474:7474"  # HTTP / Browser
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-voicedoc123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: voice-doc-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # Alert rules must be mounted too — prometheus.yml references
      # /etc/prometheus/alerts.yml and Prometheus fails to start if the
      # rule_files path is missing, so this mount is not optional.
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tempo — distributed-tracing backend (receives OTLP from the API)
  tempo:
    image: grafana/tempo:latest
    container_name: voice-doc-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API
      - "4317:4317"   # OTLP gRPC (app exports here when ENABLE_TRACING=true)
      - "4318:4318"   # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3200/ready | grep -q ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Grafana for visualization (metrics + traces)
  grafana:
    image: grafana/grafana:latest
    container_name: voice-doc-grafana
    ports:
      # Host 3001 → container 3000 (Next.js dev server uses 3000)
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - tempo

networks:
  default:
    name: voice-doc-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  temporal_data:
  neo4j_data:
  neo4j_logs:
  tempo_data:
  prometheus_data:
  grafana_data: