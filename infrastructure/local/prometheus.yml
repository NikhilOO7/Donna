# Prometheus configuration for the Meeting Assistant local stack.
# Scrapes the FastAPI backend's /metrics endpoint and exposes its own.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: voice-doc-local

# Alerting rules mirror docs/SLO.md. An SLO with no alert is a document;
# an alert with no SLO is noise.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI backend running on the host (uvicorn :8000)
  # host.docker.internal works on macOS / Windows; on Linux you may need
  # to add `extra_hosts: ['host.docker.internal:host-gateway']` to the
  # prometheus service in docker-compose.yml.
  - job_name: donna-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: api
          env: local
