# Grafana Tempo — single-binary trace backend for local dev.
# Receives spans over OTLP (gRPC :4317, HTTP :4318) from the FastAPI app
# (ENABLE_TRACING=true) and the agent dispatcher's per-agent spans.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h  # local dev: keep a day of traces

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
