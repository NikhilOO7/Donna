# Load balancer for the multi-replica overlay (docker-compose.replicas.yml).
#
# Two things here are load-bearing and easy to get wrong:
#
# 1. WebSocket upgrade. Without the Upgrade/Connection headers, /ws connections
#    are silently downgraded to plain HTTP and the live meeting board goes dead
#    while every health check stays green.
#
# 2. ip_hash. WebSockets are long-lived, so a client should land on one replica
#    and stay there. Cross-replica delivery still works via the Redis pub/sub
#    bridge — stickiness is about not thrashing connections, not correctness.
#    Deliberately NOT using least_conn: it would reshuffle sockets on reconnect
#    storms, which is exactly when you least want it.

upstream donna_backend {
    ip_hash;
    server backend:8000;
}

server {
    listen 8000;
    server_name _;

    # Long-running: the eval/query endpoints can legitimately take tens of
    # seconds, and a 60s default would sever them mid-flight.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://donna_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade — required for /api/v1/meetings/{id}/ws
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The rate limiter reads this; without it every request appears to
        # come from the load balancer and one client can exhaust everyone's
        # budget.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;   # stream responses rather than batching them
    }

    # Never rate-limit or balance-away the health check.
    location /health {
        proxy_pass http://donna_backend/health;
        access_log off;
    }
}
