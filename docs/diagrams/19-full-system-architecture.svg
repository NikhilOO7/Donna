        <g transform="translate(210,58)">
          <rect class="node-bg indigo" width="720" height="76" rx="14"/>
          <text class="node-label" x="360" y="22">🖥 Next.js 14 (App Router) · Tailwind · LiveKit React SDK</text>
          <text class="node-sub" x="360" y="42">dashboard · /meetings/[id] · assistant · login · canvas · open-items</text>
