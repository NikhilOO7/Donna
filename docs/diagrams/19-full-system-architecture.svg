          <text class="node-tag" x="250" y="32">owner_id tenancy at rows · vectors · caches · graph</text>
        </g>

        <g transform="translate(660,190)">
          <rect class="node-bg sky" width="200" height="70" rx="12"/>
          <text class="node-label" x="100" y="22">📡 LiveKit SFU</text>
          <text class="node-sub" x="100" y="40">room meeting-&lt;uuid&gt;</text>
          <text class="node-tag" x="100" y="56">1 track / person</text>
        </g>
        <g transform="translate(650,300)">
