          <text class="node-label" x="250" y="20" style="font-size:11.5px">service layer</text>
          <text class="node-sub" x="250" y="38">meeting · rag · research · memory indexer · email/.ics · llm_meter · caches</text>
        </g>
        <g transform="translate(60,432)">
