<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 430" width="1140" height="430" preserveAspectRatio="xMidYMid meet">
<rect width="100%" height="100%" fill="#0a0f1c"/>
<style>
.node-bg{fill:#1a2336;stroke:#2b3654;stroke-width:1.2}
.node-bg.indigo{stroke:#6366f1;fill:#1b1d3a}
.node-bg.violet{stroke:#8b5cf6;fill:#221a3a}
.node-bg.amber{stroke:#f59e0b;fill:#2c2418}
.node-bg.emerald{stroke:#10b981;fill:#152a23}
.node-bg.pink{stroke:#ec4899;fill:#2a1a26}
.node-bg.sky{stroke:#0ea5e9;fill:#15273a}
.node-bg.rose{stroke:#f43f5e;fill:#2a1820}
.node-bg.green{stroke:#22c55e;fill:#152a22}
.node-bg.cyan{stroke:#06b6d4;fill:#132a30}
.node-label{fill:#eaeef4;font:600 12.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}
.node-sub{fill:#8a93ab;font:10.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.06em}
.node-tag{fill:#cbd5e1;font:700 9.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.12em;text-transform:uppercase}
.edge{fill:none;stroke:#3a4258;stroke-width:1.4}
.edge.dashed{stroke-dasharray:5 5}
.edge.flow{stroke:#5c6788}
.edge.accent{stroke:#8b5cf6}
.edge.amber{stroke:#f59e0b}
.edge.pink{stroke:#ec4899}
.edge.emerald{stroke:#10b981}
.edge.sky{stroke:#0ea5e9}
.edge.rose{stroke:#f43f5e}
.edge.cyan{stroke:#06b6d4}
.edge-label{fill:#9ca3b8;font:10.5px ui-monospace,SFMono-Regular,monospace;text-anchor:middle;letter-spacing:.04em}
.lane-label{fill:#6b7390;font:700 10.5px Inter,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-anchor:middle}
text[text-anchor="start"]{text-anchor:start}
text[text-anchor="end"]{text-anchor:end}
@keyframes flowA{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes nodePulse{0%,100%{filter:drop-shadow(0 0 0 rgba(99,102,241,0))}50%{filter:drop-shadow(0 0 8px rgba(99,102,241,.55))}}
@keyframes nodePulseViolet{0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0))}50%{filter:drop-shadow(0 0 8px rgba(139,92,246,.55))}}
@keyframes nodePulseEmerald{0%,100%{filter:drop-shadow(0 0 0 rgba(16,185,129,0))}50%{filter:drop-shadow(0 0 8px rgba(16,185,129,.55))}}
.node-pulse{animation:nodePulse 2.6s ease-in-out infinite}
.node-pulse.violet{animation-name:nodePulseViolet}
.node-pulse.emerald{animation-name:nodePulseEmerald}
.flow-dot{filter:drop-shadow(0 0 4px currentColor)}
</style>
<defs>
<marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6788"/></marker>
<marker id="fa-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
<marker id="fa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="fa-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/></marker>
<marker id="fa-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
<marker id="fa-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
<marker id="fa-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
</defs>

        <text x="570" y="26" class="lane-label">RESEARCH PIPELINE · Arq research_job · 4 agents in sequence, searches in parallel</text>

        <g transform="translate(20,60)">
          <rect class="node-bg indigo" width="200" height="66" rx="12"/>
          <text class="node-label" x="100" y="18">🚀 Triggered by…</text>
          <text class="node-sub" x="100" y="36">button · email-in · nightly cron</text>
          <text class="node-tag" x="100" y="52">title + description</text>
        </g>
        <g transform="translate(270,60)">
          <rect class="node-bg amber" width="190" height="66" rx="12"/>
          <text class="node-tag" x="14" y="14" text-anchor="start" style="fill:#fbbf24">TOPIC AGENT</text>
          <text class="node-label" x="95" y="34">🧭 Extract topics</text>
          <text class="node-sub" x="95" y="52">3–5 searchable, + rationale</text>
        </g>
        <g transform="translate(510,60)">
          <rect class="node-bg sky" width="190" height="66" rx="12"/>
          <text class="node-tag" x="14" y="14" text-anchor="start" style="fill:#7dd3fc">SEARCH AGENT</text>
          <text class="node-label" x="95" y="34">🌐 Exa search</text>
          <text class="node-sub" x="95" y="52">parallel per topic · full text</text>
        </g>
        <g transform="translate(750,60)">
          <rect class="node-bg emerald" width="190" height="66" rx="12"/>
          <text class="node-tag" x="14" y="14" text-anchor="start" style="fill:#6ee7b7">VALIDATION</text>
          <text class="node-label" x="95" y="34">🛡 Credibility tiers</text>
          <text class="node-sub" x="95" y="52">Tier 1/2/3 · keep top-N</text>
        </g>
        <g transform="translate(980,60)" class="node-pulse violet">
          <rect class="node-bg violet" width="140" height="66" rx="12"/>
          <text class="node-tag" x="14" y="14" text-anchor="start" style="fill:#c4b5fd">SYNTHESIS</text>
          <text class="node-label" x="70" y="34">📋 Brief</text>
          <text class="node-sub" x="70" y="52">gpt-4o</text>
        </g>
        <path class="edge flow" d="M220,93 H268" marker-end="url(#fa)"/>
        <path class="edge flow" d="M460,93 H508" marker-end="url(#fa)"/>
        <path class="edge flow" d="M700,93 H748" marker-end="url(#fa)"/>
        <path class="edge flow" d="M940,93 H978" marker-end="url(#fa)"/>

        <text x="570" y="170" class="lane-label">WHAT THE SYNTHESIS PRODUCES</text>
        <g transform="translate(60,205)">
          <rect class="node-bg" width="230" height="64" rx="12"/>
          <text class="node-label" x="115" y="18">📈 Key findings</text>
          <text class="node-sub" x="115" y="36">each: source_url · confidence</text>
          <text class="node-tag" x="115" y="52">urgency: act_now | watch</text>
        </g>
        <g transform="translate(330,205)">
          <rect class="node-bg" width="230" height="64" rx="12"/>
          <text class="node-label" x="115" y="18">🕳 Data gaps</text>
          <text class="node-sub" x="115" y="36">"information was insufficient on…"</text>
          <text class="node-tag" x="115" y="52">honesty is a feature</text>
        </g>
        <g transform="translate(600,205)">
          <rect class="node-bg rose" width="240" height="64" rx="12"/>
          <text class="node-label" x="120" y="18">🔭 Blind spots</text>
          <text class="node-sub" x="120" y="36">2–3 adjacent topics you didn't ask about</text>
          <text class="node-tag" x="120" y="52">clickable → discuss with Donna</text>
        </g>
        <g transform="translate(880,205)">
          <rect class="node-bg emerald" width="230" height="64" rx="12"/>
          <text class="node-label" x="115" y="18">🗃 research_briefs row</text>
          <text class="node-sub" x="115" y="36">topics JSONB · exec summary</text>
          <text class="node-tag" x="115" y="52">findings matched to sources</text>
        </g>
        <path class="edge accent" d="M1050,126 V186 H175 V203" marker-end="url(#fa-v)"/>
        <path class="edge accent" d="M1050,126 V186 H445 V203" marker-end="url(#fa-v)"/>
        <path class="edge accent" d="M1050,126 V186 H720 V203" marker-end="url(#fa-v)"/>
        <path class="edge accent" d="M1050,126 V186 H995 V203" marker-end="url(#fa-v)"/>

        <text x="570" y="310" class="lane-label">THEN THE BRIEF WORKS FOR YOU</text>
        <g transform="translate(120,335)">
          <rect class="node-bg amber" width="260" height="60" rx="12"/>
          <text class="node-label" x="130" y="20">✉️ Pre-read email</text>
          <text class="node-sub" x="130" y="40">goal + agenda + tiered findings</text>
        </g>
        <g transform="translate(440,335)">
          <rect class="node-bg sky" width="260" height="60" rx="12"/>
          <text class="node-label" x="130" y="20">🃏 Insight agent feed</text>
          <text class="node-sub" x="130" y="40">research surfaces live when relevant (§10)</text>
        </g>
        <g transform="translate(760,335)">
          <rect class="node-bg" width="260" height="60" rx="12"/>
          <text class="node-label" x="130" y="20">🌙 Nightly refresh</text>
          <text class="node-sub" x="130" y="40">cron 04:10 UTC — stale briefs re-run</text>
        </g>
      </svg>