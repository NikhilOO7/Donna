<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" width="1140" height="660" preserveAspectRatio="xMidYMid meet">
<rect width="100%" height="100%" fill="#0a0f1c"/>
<style>
.node-bg{fill:#1a2336;stroke:#2b3654;stroke-width:1.2}
.node-bg.indigo{stroke:#6366f1;fill:#1b1d3a}
.node-bg.violet{stroke:#8b5cf6;fill:#221a3a}
.node-bg.amber{stroke:#f59e0b;fill:#2c2418}
.node-bg.emerald{stroke:#10b981;fill:#152a23}
.node-bg.pink{stroke:#ec4899;fill:#2a1a26}
.node-bg.sky{stroke:#0ea5e9;fill:#15273a}
.node-bg.rose{stroke:#f43f5e;fill:#2a1820}
.node-bg.green{stroke:#22c55e;fill:#152a22}
.node-bg.cyan{stroke:#06b6d4;fill:#132a30}
.node-label{fill:#eaeef4;font:600 12.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}
.node-sub{fill:#8a93ab;font:10.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.06em}
.node-tag{fill:#cbd5e1;font:700 9.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.12em;text-transform:uppercase}
.edge{fill:none;stroke:#3a4258;stroke-width:1.4}
.edge.dashed{stroke-dasharray:5 5}
.edge.flow{stroke:#5c6788}
.edge.accent{stroke:#8b5cf6}
.edge.amber{stroke:#f59e0b}
.edge.pink{stroke:#ec4899}
.edge.emerald{stroke:#10b981}
.edge.sky{stroke:#0ea5e9}
.edge.rose{stroke:#f43f5e}
.edge.cyan{stroke:#06b6d4}
.edge-label{fill:#9ca3b8;font:10.5px ui-monospace,SFMono-Regular,monospace;text-anchor:middle;letter-spacing:.04em}
.lane-label{fill:#6b7390;font:700 10.5px Inter,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-anchor:middle}
text[text-anchor="start"]{text-anchor:start}
text[text-anchor="end"]{text-anchor:end}
@keyframes flowA{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes nodePulse{0%,100%{filter:drop-shadow(0 0 0 rgba(99,102,241,0))}50%{filter:drop-shadow(0 0 8px rgba(99,102,241,.55))}}
@keyframes nodePulseViolet{0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0))}50%{filter:drop-shadow(0 0 8px rgba(139,92,246,.55))}}
@keyframes nodePulseEmerald{0%,100%{filter:drop-shadow(0 0 0 rgba(16,185,129,0))}50%{filter:drop-shadow(0 0 8px rgba(16,185,129,.55))}}
.node-pulse{animation:nodePulse 2.6s ease-in-out infinite}
.node-pulse.violet{animation-name:nodePulseViolet}
.node-pulse.emerald{animation-name:nodePulseEmerald}
.flow-dot{filter:drop-shadow(0 0 4px currentColor)}
</style>
<defs>
<marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6788"/></marker>
<marker id="fa-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
<marker id="fa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="fa-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/></marker>
<marker id="fa-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
<marker id="fa-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
<marker id="fa-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
</defs>

        <text x="570" y="26" class="lane-label">STREAMING 9-AGENT FAN-OUT · asyncio.as_completed + per-agent timeouts (was: 5-agent gather)</text>

        <g transform="translate(20,120)">
          <rect class="node-bg indigo" width="200" height="56" rx="10"/>
          <text class="node-label" x="100" y="20">📥 Final utterance</text>
          <text class="node-sub" x="100" y="38">POST /utterances (row-locked append)</text>
        </g>
        <g transform="translate(20,200)">
          <rect class="node-bg" width="200" height="66" rx="10"/>
          <text class="node-label" x="100" y="16">🔒 Redis lock, wait=False</text>
          <text class="node-sub" x="100" y="34">1 cycle per meeting</text>
          <text class="node-tag" x="100" y="52">busy? → pending flag, coalesce</text>
        </g>
        <g transform="translate(20,290)">
          <rect class="node-bg" width="200" height="66" rx="10"/>
          <text class="node-label" x="100" y="16">🥡 Slim state load</text>
          <text class="node-sub" x="100" y="34">jsonpath: last 12 utterances only</text>
          <text class="node-tag" x="100" y="52">short session — released before fan-out</text>
        </g>
        <path class="edge flow" d="M120,176 V198" marker-end="url(#fa)"/>
        <path class="edge flow" d="M120,266 V288" marker-end="url(#fa)"/>

        <ellipse cx="400" cy="330" rx="150" ry="70" fill="#8b5cf6" opacity="0.12"/>
        <g transform="translate(300,295)" class="node-pulse violet">
          <rect class="node-bg violet" width="200" height="70" rx="14"/>
          <text class="node-label" x="100" y="22">🎯 agent_dispatcher</text>
          <text class="node-sub" x="100" y="42">STREAMING FAN-OUT</text>
          <text class="node-tag" x="100" y="58">asyncio.as_completed</text>
        </g>
        <path class="edge accent" d="M220,323 H298" marker-end="url(#fa-v)"/>

        <!-- 9 agents right column -->
        <g transform="translate(600,50)">
          <rect class="node-bg emerald" width="240" height="52" rx="10"/>
          <text class="node-label" x="120" y="18">⚡ activation · 2s</text>
          <text class="node-sub" x="120" y="36">expertise match — FREE</text>
        </g>
        <g transform="translate(600,112)">
          <rect class="node-bg emerald" width="240" height="52" rx="10"/>
          <text class="node-label" x="120" y="18">📋 agenda · 3s</text>
          <text class="node-sub" x="120" y="36">coverage tracking — FREE</text>
        </g>
        <g transform="translate(600,174)">
          <rect class="node-bg emerald" width="240" height="52" rx="10"/>
          <text class="node-label" x="120" y="18">🌊 flow · 5s</text>
          <text class="node-sub" x="120" y="36">talk-time + decision pace — FREE</text>
        </g>
        <g transform="translate(600,236)">
          <rect class="node-bg pink" width="240" height="52" rx="10"/>
          <text class="node-label" x="120" y="18">🧠 memory · 6s</text>
          <text class="node-sub" x="120" y="36">past decisions resurface (Neo4j)</text>
        </g>
        <g transform="translate(600,298)">
          <rect class="node-bg pink" width="240" height="52" rx="10"/>
          <text class="node-label" x="120" y="18">🕸 kg_query · 8s</text>
          <text class="node-sub" x="120" y="36">spaCy + 1–2 hop graph traversal</text>
        </g>
        <g transform="translate(600,360)">
          <rect class="node-bg sky" width="240" height="52" rx="10"/>
          <text class="node-label" x="120" y="18">📚 context · 10s</text>
          <text class="node-sub" x="120" y="36">RAG: docs + memories, cited</text>
        </g>
        <g transform="translate(600,422)">
          <rect class="node-bg amber" width="240" height="52" rx="10"/>
          <text class="node-label" x="120" y="18">✍️ scribe · 12s</text>
          <text class="node-sub" x="120" y="36">regex gate → gpt-4o-mini</text>
        </g>
        <g transform="translate(600,484)">
          <rect class="node-bg amber" width="240" height="52" rx="10"/>
          <text class="node-label" x="120" y="18">💡 insight · 12s</text>
          <text class="node-sub" x="120" y="36">research brief ↔ live topics</text>
        </g>
        <g transform="translate(600,546)">
          <rect class="node-bg amber" width="240" height="52" rx="10"/>
          <text class="node-label" x="120" y="18">🔎 fact_check · 25s</text>
          <text class="node-sub" x="120" y="36">claim gate → Exa → verdict</text>
        </g>

        <path class="edge emerald" d="M500,310 C560,240 560,90 598,76" marker-end="url(#fa-e)"/>
        <path class="edge emerald" d="M500,318 C560,270 560,150 598,138" marker-end="url(#fa-e)"/>
        <path class="edge emerald" d="M500,326 C560,290 560,210 598,200" marker-end="url(#fa-e)"/>
        <path class="edge pink" d="M500,330 C555,320 555,268 598,262" marker-end="url(#fa-p)"/>
        <path class="edge pink" d="M500,334 H598 V324" marker-end="url(#fa-p)"/>
        <path class="edge sky" d="M500,340 C555,350 555,382 598,386" marker-end="url(#fa-s)"/>
        <path class="edge amber" d="M500,346 C560,380 560,440 598,448" marker-end="url(#fa-a)"/>
        <path class="edge amber" d="M500,352 C560,420 560,500 598,510" marker-end="url(#fa-a)"/>
        <path class="edge amber" d="M500,358 C560,460 560,562 598,572" marker-end="url(#fa-a)"/>

        <!-- Emit path -->
        <g transform="translate(920,230)" class="node-pulse emerald">
          <rect class="node-bg emerald" width="200" height="90" rx="12"/>
          <text class="node-label" x="100" y="20">📤 EMIT — per result,</text>
          <text class="node-label" x="100" y="38">the moment it lands</text>
          <text class="node-sub" x="100" y="58">suppress? → persist → speak?</text>
          <text class="node-sub" x="100" y="74">→ WS broadcast → metrics</text>
        </g>
        <g transform="translate(920,350)">
          <rect class="node-bg" width="200" height="60" rx="12"/>
          <text class="node-label" x="100" y="18">🗑 learned-mute</text>
          <text class="node-sub" x="100" y="36">8 dismissals + 0 pins</text>
          <text class="node-tag" x="100" y="52">→ that type stops firing</text>
        </g>
        <path class="edge emerald" d="M840,76 C890,90 900,180 918,240" marker-end="url(#fa-e)"/>
        <path class="edge emerald" d="M840,324 C880,320 890,300 918,290" marker-end="url(#fa-e)"/>
        <path class="edge emerald" d="M840,572 C900,560 910,420 1000,322" marker-end="url(#fa-e)"/>
        <path class="edge dashed" d="M1020,320 V348" marker-end="url(#fa)"/>

        <text x="330" y="470" class="lane-label" style="text-anchor:start">KEY PROPERTIES</text>
        <g transform="translate(300,490)"><rect class="node-bg" width="250" height="44" rx="10"/><text class="node-label" x="125" y="16" style="font-size:11px">timeout kills ONE agent, not the cycle</text><text class="node-sub" x="125" y="32">wait_for per agent · errors → None</text></g>
        <g transform="translate(300,544)"><rect class="node-bg" width="250" height="44" rx="10"/><text class="node-label" x="125" y="16" style="font-size:11px">per-emit short DB sessions</text><text class="node-sub" x="125" y="32">no pool connection pinned for 25s</text></g>
        <g transform="translate(300,598)"><rect class="node-bg" width="250" height="44" rx="10"/><text class="node-label" x="125" y="16" style="font-size:11px">burst coalescing</text><text class="node-sub" x="125" y="32">N rapid utterances → 1 extra cycle, max 3</text></g>
      </svg>