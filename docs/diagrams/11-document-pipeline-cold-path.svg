<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" width="1140" height="560" preserveAspectRatio="xMidYMid meet">
<rect width="100%" height="100%" fill="#0a0f1c"/>
<style>
.node-bg{fill:#1a2336;stroke:#2b3654;stroke-width:1.2}
.node-bg.indigo{stroke:#6366f1;fill:#1b1d3a}
.node-bg.violet{stroke:#8b5cf6;fill:#221a3a}
.node-bg.amber{stroke:#f59e0b;fill:#2c2418}
.node-bg.emerald{stroke:#10b981;fill:#152a23}
.node-bg.pink{stroke:#ec4899;fill:#2a1a26}
.node-bg.sky{stroke:#0ea5e9;fill:#15273a}
.node-bg.rose{stroke:#f43f5e;fill:#2a1820}
.node-bg.green{stroke:#22c55e;fill:#152a22}
.node-bg.cyan{stroke:#06b6d4;fill:#132a30}
.node-label{fill:#eaeef4;font:600 12.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}
.node-sub{fill:#8a93ab;font:10.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.06em}
.node-tag{fill:#cbd5e1;font:700 9.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.12em;text-transform:uppercase}
.edge{fill:none;stroke:#3a4258;stroke-width:1.4}
.edge.dashed{stroke-dasharray:5 5}
.edge.flow{stroke:#5c6788}
.edge.accent{stroke:#8b5cf6}
.edge.amber{stroke:#f59e0b}
.edge.pink{stroke:#ec4899}
.edge.emerald{stroke:#10b981}
.edge.sky{stroke:#0ea5e9}
.edge.rose{stroke:#f43f5e}
.edge.cyan{stroke:#06b6d4}
.edge-label{fill:#9ca3b8;font:10.5px ui-monospace,SFMono-Regular,monospace;text-anchor:middle;letter-spacing:.04em}
.lane-label{fill:#6b7390;font:700 10.5px Inter,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-anchor:middle}
text[text-anchor="start"]{text-anchor:start}
text[text-anchor="end"]{text-anchor:end}
@keyframes flowA{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes nodePulse{0%,100%{filter:drop-shadow(0 0 0 rgba(99,102,241,0))}50%{filter:drop-shadow(0 0 8px rgba(99,102,241,.55))}}
@keyframes nodePulseViolet{0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0))}50%{filter:drop-shadow(0 0 8px rgba(139,92,246,.55))}}
@keyframes nodePulseEmerald{0%,100%{filter:drop-shadow(0 0 0 rgba(16,185,129,0))}50%{filter:drop-shadow(0 0 8px rgba(16,185,129,.55))}}
.node-pulse{animation:nodePulse 2.6s ease-in-out infinite}
.node-pulse.violet{animation-name:nodePulseViolet}
.node-pulse.emerald{animation-name:nodePulseEmerald}
.flow-dot{filter:drop-shadow(0 0 4px currentColor)}
</style>
<defs>
<marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6788"/></marker>
<marker id="fa-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
<marker id="fa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="fa-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/></marker>
<marker id="fa-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
<marker id="fa-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
<marker id="fa-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
</defs>

        <text x="570" y="26" class="lane-label">DOCUMENT INGESTION · COLD PATH (job-worker)</text>

        <g transform="translate(20,60)">
          <rect class="node-bg indigo" width="190" height="64" rx="12"/>
          <text class="node-label" x="95" y="22">📄 POST /documents/upload</text>
          <text class="node-sub" x="95" y="42">multipart · JWT owner</text>
        </g>
        <g transform="translate(250,60)">
          <rect class="node-bg sky" width="170" height="64" rx="12"/>
          <text class="node-label" x="85" y="18">🔍 Dedupe check</text>
          <text class="node-sub" x="85" y="36">sha-256 content hash</text>
          <text class="node-tag" x="85" y="52">failed dup → replace</text>
        </g>
        <g transform="translate(460,60)">
          <rect class="node-bg emerald" width="160" height="64" rx="12"/>
          <text class="node-label" x="80" y="22">🪣 MinIO store</text>
          <text class="node-sub" x="80" y="42">original kept forever</text>
        </g>
        <g transform="translate(660,60)" class="node-pulse violet">
          <rect class="node-bg violet" width="200" height="64" rx="12"/>
          <text class="node-label" x="100" y="18">⚡ enqueue job</text>
          <text class="node-sub" x="100" y="36">process_document_job (Arq)</text>
          <text class="node-tag" x="100" y="52">API returns in &lt;1s</text>
        </g>
        <g transform="translate(900,60)">
          <rect class="node-bg" width="220" height="64" rx="12"/>
          <text class="node-label" x="110" y="18">🛟 Fallback</text>
          <text class="node-sub" x="110" y="36">Redis down → BackgroundTasks</text>
          <text class="node-tag" x="110" y="52">degrade, never drop</text>
        </g>

        <path class="edge flow" d="M210,92 H248" marker-end="url(#fa)"/>
        <path class="edge flow" d="M420,92 H458" marker-end="url(#fa)"/>
        <path class="edge flow" d="M620,92 H658" marker-end="url(#fa)"/>
        <path class="edge dashed" d="M860,92 H898" marker-end="url(#fa)"/>

        <text x="570" y="152" class="lane-label">4 INGESTION AGENTS · warm ServiceContainer (models load once per worker)</text>

        <g transform="translate(40,190)">
          <rect class="node-bg amber" width="250" height="70" rx="12"/>
          <text class="node-tag" x="14" y="14" text-anchor="start" style="fill:#fbbf24">LAYOUT AGENT</text>
          <text class="node-label" x="125" y="34">📐 Docling structure</text>
          <text class="node-sub" x="125" y="52">sections · order · fallbacks</text>
        </g>
        <g transform="translate(310,190)">
          <rect class="node-bg amber" width="250" height="70" rx="12"/>
          <text class="node-tag" x="14" y="14" text-anchor="start" style="fill:#fbbf24">TABLE AGENT</text>
          <text class="node-label" x="125" y="34">🧮 Table normalization</text>
          <text class="node-sub" x="125" y="52">grid → markdown (4o-mini)</text>
        </g>
        <g transform="translate(580,190)">
          <rect class="node-bg amber" width="250" height="70" rx="12"/>
          <text class="node-tag" x="14" y="14" text-anchor="start" style="fill:#fbbf24">IMAGE AGENT</text>
          <text class="node-label" x="125" y="34">🖼 Figures &amp; charts</text>
          <text class="node-sub" x="125" y="52">EasyOCR + vision describe</text>
        </g>
        <g transform="translate(850,190)">
          <rect class="node-bg amber" width="260" height="70" rx="12"/>
          <text class="node-tag" x="14" y="14" text-anchor="start" style="fill:#fbbf24">RELATIONSHIP AGENT</text>
          <text class="node-label" x="130" y="34">🕸 Entity relations</text>
          <text class="node-sub" x="130" y="52">spaCy NER → graph edges</text>
        </g>

        <path class="edge accent" d="M760,124 V168 H165 V188" marker-end="url(#fa-v)"/>
        <path class="edge accent" d="M760,124 V168 H435 V188" marker-end="url(#fa-v)"/>
        <path class="edge accent" d="M760,124 V168 H705 V188" marker-end="url(#fa-v)"/>
        <path class="edge accent" d="M760,124 V168 H980 V188" marker-end="url(#fa-v)"/>

        <g transform="translate(190,300)">
          <rect class="node-bg cyan" width="330" height="70" rx="12"/>
          <text class="node-label" x="165" y="22">✂️ Semantic chunking</text>
          <text class="node-sub" x="165" y="42">section-aware · element-typed (text/table/image)</text>
          <text class="node-tag" x="165" y="58">chunk rows → PostgreSQL</text>
        </g>
        <g transform="translate(610,300)" class="node-pulse">
          <rect class="node-bg indigo" width="340" height="70" rx="12"/>
          <text class="node-label" x="170" y="22">🧬 3-level contextual embeddings</text>
          <text class="node-sub" x="170" y="42">local 50% · document 30% · global 20% (§06)</text>
          <text class="node-tag" x="170" y="58">batched ×96 · text-embedding-3-small</text>
        </g>

        <path class="edge flow" d="M355,260 V298" marker-end="url(#fa)"/>
        <path class="edge flow" d="M520,335 H608" marker-end="url(#fa)"/>

        <text x="95" y="414" class="lane-label" text-anchor="start">DESTINATIONS</text>
        <g transform="translate(90,435)">
          <rect class="node-bg emerald" width="280" height="64" rx="12"/>
          <text class="node-label" x="140" y="18">🎯 Qdrant · 4 collections</text>
          <text class="node-sub" x="140" y="36">local / document / global / unified</text>
          <text class="node-tag" x="140" y="52">payload: owner_id · metadata</text>
        </g>
        <g transform="translate(430,435)">
          <rect class="node-bg pink" width="280" height="64" rx="12"/>
          <text class="node-label" x="140" y="18">🕸 Neo4j graph</text>
          <text class="node-sub" x="140" y="36">entities + relationships</text>
          <text class="node-tag" x="140" y="52">optional — degrades to PG</text>
        </g>
        <g transform="translate(770,435)">
          <rect class="node-bg" width="280" height="64" rx="12"/>
          <text class="node-label" x="140" y="18">🗄 PostgreSQL</text>
          <text class="node-sub" x="140" y="36">document + chunk rows, status=completed</text>
          <text class="node-tag" x="140" y="52">RAG caches invalidated</text>
        </g>
        <path class="edge emerald" d="M300,370 V400 H230 V433" marker-end="url(#fa-e)"/>
        <path class="edge pink" d="M780,370 V400 H570 V433" marker-end="url(#fa-p)"/>
        <path class="edge flow" d="M900,370 V433" marker-end="url(#fa)"/>
      </svg>