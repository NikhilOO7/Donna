<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 540" width="1140" height="540" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="#0a0f1c"/>
  <style>
.node-bg{fill:#1a2336;stroke:#2b3654;stroke-width:1.2}
.node-bg.indigo{stroke:#6366f1;fill:#1b1d3a}
.node-bg.violet{stroke:#8b5cf6;fill:#221a3a}
.node-bg.amber{stroke:#f59e0b;fill:#2c2418}
.node-bg.emerald{stroke:#10b981;fill:#152a23}
.node-bg.pink{stroke:#ec4899;fill:#2a1a26}
.node-bg.sky{stroke:#0ea5e9;fill:#15273a}
.node-bg.rose{stroke:#f43f5e;fill:#2a1820}
.node-bg.green{stroke:#22c55e;fill:#152a22}
.node-label{fill:#eaeef4;font:600 12.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}
.node-sub{fill:#8a93ab;font:10.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.06em}
.node-tag{fill:#cbd5e1;font:700 9.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.12em;text-transform:uppercase}
.edge{fill:none;stroke:#3a4258;stroke-width:1.4}
.edge.dashed{stroke-dasharray:5 5}
.edge.flow{stroke:#5c6788}
.edge.accent{stroke:#8b5cf6}
.edge.amber{stroke:#f59e0b}
.edge.pink{stroke:#ec4899}
.edge.emerald{stroke:#10b981}
.edge.sky{stroke:#0ea5e9}
.edge-label{fill:#9ca3b8;font:10.5px ui-monospace,SFMono-Regular,monospace;text-anchor:middle;letter-spacing:.04em}
.lane-label{fill:#6b7390;font:700 10.5px Inter,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-anchor:middle}
@keyframes flowA{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes nodePulse{0%,100%{filter:drop-shadow(0 0 0 rgba(99,102,241,0))}50%{filter:drop-shadow(0 0 8px rgba(99,102,241,.55))}}
@keyframes nodePulseViolet{0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0))}50%{filter:drop-shadow(0 0 8px rgba(139,92,246,.55))}}
@keyframes nodePulseAmber{0%,100%{filter:drop-shadow(0 0 0 rgba(245,158,11,0))}50%{filter:drop-shadow(0 0 8px rgba(245,158,11,.55))}}
@keyframes nodePulseEmerald{0%,100%{filter:drop-shadow(0 0 0 rgba(16,185,129,0))}50%{filter:drop-shadow(0 0 8px rgba(16,185,129,.55))}}
.node-pulse{animation:nodePulse 2.6s ease-in-out infinite}
.node-pulse.violet{animation-name:nodePulseViolet}
.node-pulse.amber{animation-name:nodePulseAmber}
.node-pulse.emerald{animation-name:nodePulseEmerald}
.flow-dot{filter:drop-shadow(0 0 4px currentColor)}
</style>
          <defs>
            <marker id="va" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6788"/></marker>
            <marker id="va-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
            <marker id="va-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
            <marker id="va-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/></marker>
            <marker id="va-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
          </defs>

          <text x="170" y="28" class="lane-label">BROWSER</text>
          <text x="490" y="28" class="lane-label">LIVEKIT</text>
          <text x="810" y="28" class="lane-label">VOICE WORKER (separate process)</text>
          <text x="1080" y="28" class="lane-label">BACKEND</text>

          <line x1="335" y1="44" x2="335" y2="510" class="edge dashed" opacity=".3"/>
          <line x1="650" y1="44" x2="650" y2="510" class="edge dashed" opacity=".3"/>
          <line x1="1020" y1="44" x2="1020" y2="510" class="edge dashed" opacity=".3"/>

          <!-- ===== Stage 1: Token + connect ===== -->
          <g transform="translate(50,70)">
            <circle cx="17" cy="17" r="17" fill="#1b1d3a" stroke="#6366f1" stroke-width="1.5"/>
            <text x="17" y="22" class="node-label" style="font-size:13px">1</text>
          </g>
          <g transform="translate(95,60)">
            <rect class="node-bg indigo" width="220" height="50" rx="10"/>
            <text class="node-label" x="110" y="20">👤 Click Enable Mic</text>
            <text class="node-sub"   x="110" y="38">LiveAudioCapture.tsx</text>
          </g>
          <g transform="translate(95,130)">
            <rect class="node-bg violet" width="220" height="50" rx="10"/>
            <text class="node-label" x="110" y="20">GET /voice-token</text>
            <text class="node-sub"   x="110" y="38">JWT FOR meeting-{id}</text>
          </g>
          <path d="M205 110 L 205 130" class="edge flow accent" marker-end="url(#va-v)"/>
          <path d="M315 155 C 350 155 350 75 1020 75" class="edge flow accent dashed" opacity=".5"/>
          <text x="600" y="60" class="edge-label">{ token, url }</text>

          <!-- ===== Stage 2: LiveKit room ===== -->
          <g transform="translate(355,70)">
            <circle cx="17" cy="17" r="17" fill="#2c2418" stroke="#f59e0b" stroke-width="1.5"/>
            <text x="17" y="22" class="node-label" style="font-size:13px">2</text>
          </g>
          <g transform="translate(395,60)" class="node-pulse amber">
            <rect class="node-bg amber" width="240" height="90" rx="12"/>
            <text class="node-label" x="120" y="24">🎙 LiveKit Server</text>
            <text class="node-sub"   x="120" y="46">WEBRTC SFU</text>
            <text class="node-tag"   x="120" y="66">room: meeting-{id}</text>
          </g>
          <path d="M205 180 C 250 180 350 100 395 105" class="edge flow amber" marker-end="url(#va-a)"/>
          <text x="280" y="155" class="edge-label" style="fill:#f59e0b">publish mic track</text>

          <!-- ===== Stage 3: Worker auto-join ===== -->
          <g transform="translate(670,70)">
            <circle cx="17" cy="17" r="17" fill="#2a1a26" stroke="#ec4899" stroke-width="1.5"/>
            <text x="17" y="22" class="node-label" style="font-size:13px">3</text>
          </g>
          <g transform="translate(710,60)" class="node-pulse">
            <rect class="node-bg pink" width="290" height="90" rx="12"/>
            <text class="node-label" x="145" y="24">🤖 meeting_voice_worker</text>
            <text class="node-sub"   x="145" y="46">SEPARATE PYTHON PROCESS</text>
            <text class="node-tag"   x="145" y="66">AUTO-JOIN meeting-* ROOMS</text>
          </g>
          <path d="M635 105 L 710 105" class="edge flow pink" marker-end="url(#va-p)"/>
          <text x="672" y="95" class="edge-label" style="fill:#ec4899">subscribe AUDIO</text>
          <path d="M710 130 L 635 130" class="edge flow pink dashed" opacity=".6"/>
          <text x="672" y="146" class="edge-label">TTS track</text>

          <!-- Audio frame -->
          <g transform="translate(395,210)">
            <rect class="node-bg" width="240" height="46" rx="8"/>
            <text class="node-label" x="120" y="20">🎵 rtc.AudioFrame</text>
            <text class="node-sub"   x="120" y="38">48 kHz · LINEAR16 · PCM</text>
          </g>
          <path d="M515 150 L 515 210" class="edge flow amber" marker-end="url(#va-a)"/>
          <path d="M635 233 L 710 233" class="edge flow pink" marker-end="url(#va-p)"/>
          <text x="672" y="223" class="edge-label">raw bytes</text>

          <!-- ===== Stage 4: Deepgram ===== -->
          <g transform="translate(670,290)">
            <circle cx="17" cy="17" r="17" fill="#2a1a26" stroke="#ec4899" stroke-width="1.5"/>
            <text x="17" y="22" class="node-label" style="font-size:13px">4</text>
          </g>
          <g transform="translate(710,280)" class="node-pulse">
            <rect class="node-bg pink" width="290" height="76" rx="12"/>
            <text class="node-label" x="145" y="24">🎯 Deepgram nova-3 STT</text>
            <text class="node-sub"   x="145" y="46">RECONNECT LOOP · 1s → 15s</text>
            <text class="node-tag"   x="145" y="64">FRAME BUFFERED ON DROP</text>
          </g>
          <path d="M855 150 L 855 280" class="edge flow pink" marker-end="url(#va-p)"/>
          <text x="880" y="220" class="edge-label" style="fill:#ec4899">streaming WS</text>

          <!-- Transcript output -->
          <g transform="translate(710,390)">
            <rect class="node-bg" width="290" height="50" rx="10"/>
            <text class="node-label" x="145" y="20">📝 final transcript</text>
            <text class="node-sub"   x="145" y="38">is_final = true · SMART FORMAT</text>
          </g>
          <path d="M855 356 L 855 390" class="edge flow pink dashed" opacity=".7"/>

          <!-- ===== Stage 5: POST back to API ===== -->
          <g transform="translate(1040,390)">
            <circle cx="17" cy="17" r="17" fill="#1b1d3a" stroke="#6366f1" stroke-width="1.5"/>
            <text x="17" y="22" class="node-label" style="font-size:13px">5</text>
          </g>
          <g transform="translate(1040,440)">
            <rect class="node-bg violet" width="80" height="60" rx="10"/>
            <text class="node-label" x="40" y="22">POST</text>
            <text class="node-sub"   x="40" y="42">/utterances</text>
          </g>
          <path d="M1000 415 L 1080 440" class="edge flow accent" marker-end="url(#va-v)"/>
          <text x="1080" y="425" class="edge-label" text-anchor="end" style="fill:#8b5cf6">retry 5× · 0.5→8s</text>

          <!-- Continuation note -->
          <g transform="translate(95,440)">
            <rect class="node-bg emerald" width="850" height="50" rx="10"/>
            <text class="node-label" x="425" y="20">➡ From here: identical to Text Chat Flow</text>
            <text class="node-sub"   x="425" y="38">PERSIST · WS BROADCAST · 5-AGENT DISPATCH</text>
          </g>
          <path d="M1080 500 C 1080 510 500 510 520 490" class="edge flow emerald dashed" opacity=".6"/>

          <!-- Animated dots -->
          <circle r="3.5" fill="#8b5cf6" class="flow-dot" style="color:#8b5cf6;offset-path:path('M205 110 L 205 130');animation:flowA 0.8s linear infinite"/>
          <circle r="3" fill="#f59e0b" class="flow-dot" style="color:#f59e0b;offset-path:path('M205 180 C 250 180 350 100 395 105');animation:flowA 2.0s linear infinite"/>
          <circle r="3.5" fill="#ec4899" class="flow-dot" style="color:#ec4899;offset-path:path('M635 105 L 710 105');animation:flowA 1.2s linear infinite"/>
          <circle r="3" fill="#f59e0b" class="flow-dot" style="color:#f59e0b;offset-path:path('M515 150 L 515 210');animation:flowA 1.0s linear infinite .2s"/>
          <circle r="3" fill="#ec4899" class="flow-dot" style="color:#ec4899;offset-path:path('M635 233 L 710 233');animation:flowA 0.9s linear infinite .4s"/>
          <circle r="3" fill="#ec4899" class="flow-dot" style="color:#ec4899;offset-path:path('M855 150 L 855 280');animation:flowA 1.6s linear infinite .8s"/>
          <circle r="3.5" fill="#8b5cf6" class="flow-dot" style="color:#8b5cf6;offset-path:path('M1000 415 L 1080 440');animation:flowA 1.3s linear infinite 1.2s"/>

          <text x="570" y="525" class="node-sub" text-anchor="middle" opacity=".7">
            Worker auto-joins · Deepgram reconnect-loop is the resilience win · Final transcript POSTs to the same endpoint manual input uses
          </text>
        </svg>
