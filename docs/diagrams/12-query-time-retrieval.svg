<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 470" width="1140" height="470" preserveAspectRatio="xMidYMid meet">
<rect width="100%" height="100%" fill="#0a0f1c"/>
<style>
.node-bg{fill:#1a2336;stroke:#2b3654;stroke-width:1.2}
.node-bg.indigo{stroke:#6366f1;fill:#1b1d3a}
.node-bg.violet{stroke:#8b5cf6;fill:#221a3a}
.node-bg.amber{stroke:#f59e0b;fill:#2c2418}
.node-bg.emerald{stroke:#10b981;fill:#152a23}
.node-bg.pink{stroke:#ec4899;fill:#2a1a26}
.node-bg.sky{stroke:#0ea5e9;fill:#15273a}
.node-bg.rose{stroke:#f43f5e;fill:#2a1820}
.node-bg.green{stroke:#22c55e;fill:#152a22}
.node-bg.cyan{stroke:#06b6d4;fill:#132a30}
.node-label{fill:#eaeef4;font:600 12.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}
.node-sub{fill:#8a93ab;font:10.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.06em}
.node-tag{fill:#cbd5e1;font:700 9.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.12em;text-transform:uppercase}
.edge{fill:none;stroke:#3a4258;stroke-width:1.4}
.edge.dashed{stroke-dasharray:5 5}
.edge.flow{stroke:#5c6788}
.edge.accent{stroke:#8b5cf6}
.edge.amber{stroke:#f59e0b}
.edge.pink{stroke:#ec4899}
.edge.emerald{stroke:#10b981}
.edge.sky{stroke:#0ea5e9}
.edge.rose{stroke:#f43f5e}
.edge.cyan{stroke:#06b6d4}
.edge-label{fill:#9ca3b8;font:10.5px ui-monospace,SFMono-Regular,monospace;text-anchor:middle;letter-spacing:.04em}
.lane-label{fill:#6b7390;font:700 10.5px Inter,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-anchor:middle}
text[text-anchor="start"]{text-anchor:start}
text[text-anchor="end"]{text-anchor:end}
@keyframes flowA{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes nodePulse{0%,100%{filter:drop-shadow(0 0 0 rgba(99,102,241,0))}50%{filter:drop-shadow(0 0 8px rgba(99,102,241,.55))}}
@keyframes nodePulseViolet{0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0))}50%{filter:drop-shadow(0 0 8px rgba(139,92,246,.55))}}
@keyframes nodePulseEmerald{0%,100%{filter:drop-shadow(0 0 0 rgba(16,185,129,0))}50%{filter:drop-shadow(0 0 8px rgba(16,185,129,.55))}}
.node-pulse{animation:nodePulse 2.6s ease-in-out infinite}
.node-pulse.violet{animation-name:nodePulseViolet}
.node-pulse.emerald{animation-name:nodePulseEmerald}
.flow-dot{filter:drop-shadow(0 0 4px currentColor)}
</style>
<defs>
<marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6788"/></marker>
<marker id="fa-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
<marker id="fa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="fa-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/></marker>
<marker id="fa-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
<marker id="fa-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
<marker id="fa-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
</defs>

        <text x="570" y="26" class="lane-label">QUERY-TIME RETRIEVAL · /api/v1/query · ask-donna · context agent · MCP</text>

        <g transform="translate(20,60)">
          <rect class="node-bg indigo" width="200" height="60" rx="12"/>
          <text class="node-label" x="100" y="20">❓ User query</text>
          <text class="node-sub" x="100" y="40">+ conversation history</text>
        </g>
        <g transform="translate(260,60)">
          <rect class="node-bg sky" width="220" height="60" rx="12"/>
          <text class="node-label" x="110" y="16">🧠 Embedding cache</text>
          <text class="node-sub" x="110" y="34">Redis · 24h · float32+b64 packed</text>
          <text class="node-tag" x="110" y="50">hit → $0, ~1ms</text>
        </g>
        <g transform="translate(520,60)">
          <rect class="node-bg" width="200" height="60" rx="12"/>
          <text class="node-label" x="100" y="20">🔤 Embed query</text>
          <text class="node-sub" x="100" y="40">text-embedding-3-small</text>
        </g>
        <g transform="translate(760,60)" class="node-pulse emerald">
          <rect class="node-bg emerald" width="240" height="60" rx="12"/>
          <text class="node-label" x="120" y="16">🎯 Qdrant search</text>
          <text class="node-sub" x="120" y="34">owner_id filter (tenancy) · top-k</text>
          <text class="node-tag" x="120" y="50">docs + meeting memories</text>
        </g>

        <path class="edge flow" d="M220,90 H258" marker-end="url(#fa)"/>
        <path class="edge sky" d="M480,90 H518" marker-end="url(#fa-s)"/>
        <path class="edge flow" d="M720,90 H758" marker-end="url(#fa)"/>
        <path class="edge dashed sky" d="M370,120 V150 H880 V122" marker-end="url(#fa-s)"/>
        <text x="620" y="144" class="edge-label">cache miss → embed → store packed vector</text>

        <g transform="translate(120,200)">
          <rect class="node-bg violet" width="280" height="70" rx="12"/>
          <text class="node-label" x="140" y="18">⚖️ Hybrid re-rank</text>
          <text class="node-sub" x="140" y="36">0.7·vector + 0.2·lexical overlap + 0.1·entity hits</text>
          <text class="node-tag" x="140" y="54">exact terms break embedding ties</text>
        </g>
        <g transform="translate(440,200)">
          <rect class="node-bg amber" width="280" height="70" rx="12"/>
          <text class="node-label" x="140" y="18">🧾 Citations built</text>
          <text class="node-sub" x="140" y="36">"Q3_Report.pdf · §Budget · p.12"</text>
          <text class="node-tag" x="140" y="54">or "Meeting: title (date)" + quote</text>
        </g>
        <g transform="translate(760,200)">
          <rect class="node-bg rose" width="280" height="70" rx="12"/>
          <text class="node-label" x="140" y="18">📊 Confidence score</text>
          <text class="node-sub" x="140" y="36">top similarity × source agreement</text>
          <text class="node-tag" x="140" y="54">lone marginal hit scores low</text>
        </g>

        <path class="edge emerald" d="M880,120 V170 H260 V198" marker-end="url(#fa-e)"/>
        <path class="edge flow" d="M400,235 H438" marker-end="url(#fa)"/>
        <path class="edge flow" d="M720,235 H758" marker-end="url(#fa)"/>

        <g transform="translate(280,320)" class="node-pulse violet">
          <rect class="node-bg violet" width="300" height="66" rx="12"/>
          <text class="node-label" x="150" y="20">💬 Answer generation</text>
          <text class="node-sub" x="150" y="40">gpt-4o (smart tier) · named sources in prompt</text>
        </g>
        <g transform="translate(640,320)">
          <rect class="node-bg sky" width="300" height="66" rx="12"/>
          <text class="node-label" x="150" y="16">🗂 Response cache</text>
          <text class="node-sub" x="150" y="34">Redis · 5 min · key = owner+query+level</text>
          <text class="node-tag" x="150" y="52">invalidated on doc upload/delete</text>
        </g>
        <path class="edge flow" d="M580,270 V300 H430 V318" marker-end="url(#fa)"/>
        <path class="edge flow" d="M580,353 H638" marker-end="url(#fa)"/>
        <text x="570" y="440" class="lane-label">EVERY ANSWER SHIPS: text + sources[] + citations + confidence</text>
      </svg>