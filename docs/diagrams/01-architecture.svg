<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 540" width="1140" height="540" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="#0a0f1c"/>
  <style>
.node-bg{fill:#1a2336;stroke:#2b3654;stroke-width:1.2}
.node-bg.indigo{stroke:#6366f1;fill:#1b1d3a}
.node-bg.violet{stroke:#8b5cf6;fill:#221a3a}
.node-bg.amber{stroke:#f59e0b;fill:#2c2418}
.node-bg.emerald{stroke:#10b981;fill:#152a23}
.node-bg.pink{stroke:#ec4899;fill:#2a1a26}
.node-bg.sky{stroke:#0ea5e9;fill:#15273a}
.node-bg.rose{stroke:#f43f5e;fill:#2a1820}
.node-bg.green{stroke:#22c55e;fill:#152a22}
.node-label{fill:#eaeef4;font:600 12.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}
.node-sub{fill:#8a93ab;font:10.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.06em}
.node-tag{fill:#cbd5e1;font:700 9.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.12em;text-transform:uppercase}
.edge{fill:none;stroke:#3a4258;stroke-width:1.4}
.edge.dashed{stroke-dasharray:5 5}
.edge.flow{stroke:#5c6788}
.edge.accent{stroke:#8b5cf6}
.edge.amber{stroke:#f59e0b}
.edge.pink{stroke:#ec4899}
.edge.emerald{stroke:#10b981}
.edge.sky{stroke:#0ea5e9}
.edge-label{fill:#9ca3b8;font:10.5px ui-monospace,SFMono-Regular,monospace;text-anchor:middle;letter-spacing:.04em}
.lane-label{fill:#6b7390;font:700 10.5px Inter,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-anchor:middle}
@keyframes flowA{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes nodePulse{0%,100%{filter:drop-shadow(0 0 0 rgba(99,102,241,0))}50%{filter:drop-shadow(0 0 8px rgba(99,102,241,.55))}}
@keyframes nodePulseViolet{0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0))}50%{filter:drop-shadow(0 0 8px rgba(139,92,246,.55))}}
@keyframes nodePulseAmber{0%,100%{filter:drop-shadow(0 0 0 rgba(245,158,11,0))}50%{filter:drop-shadow(0 0 8px rgba(245,158,11,.55))}}
@keyframes nodePulseEmerald{0%,100%{filter:drop-shadow(0 0 0 rgba(16,185,129,0))}50%{filter:drop-shadow(0 0 8px rgba(16,185,129,.55))}}
.node-pulse{animation:nodePulse 2.6s ease-in-out infinite}
.node-pulse.violet{animation-name:nodePulseViolet}
.node-pulse.amber{animation-name:nodePulseAmber}
.node-pulse.emerald{animation-name:nodePulseEmerald}
.flow-dot{filter:drop-shadow(0 0 4px currentColor)}
</style>
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#5c6788"/>
            </marker>
            <marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
            </marker>
            <marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/>
            </marker>
            <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
            </marker>
            <marker id="arr-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
            </marker>
          </defs>

          <!-- Lane labels -->
          <text x="105"  y="28" class="lane-label">CLIENT</text>
          <text x="345"  y="28" class="lane-label">API EDGE</text>
          <text x="610"  y="28" class="lane-label">VOICE PROCESS</text>
          <text x="900"  y="28" class="lane-label">DATA · EXTERNAL</text>

          <!-- Lane separators -->
          <line x1="230" y1="44" x2="230" y2="520" class="edge dashed" opacity=".35"/>
          <line x1="475" y1="44" x2="475" y2="520" class="edge dashed" opacity=".35"/>
          <line x1="755" y1="44" x2="755" y2="520" class="edge dashed" opacity=".35"/>

          <!-- ===== Client column ===== -->
          <g transform="translate(20,70)">
            <rect class="node-bg indigo" width="200" height="60" rx="10"/>
            <text class="node-label" x="100" y="22">Next.js UI</text>
            <text class="node-sub"   x="100" y="42">REACT 18 · LIVEKIT-CLIENT</text>
          </g>
          <g transform="translate(20,160)">
            <rect class="node-bg indigo" width="200" height="60" rx="10"/>
            <text class="node-label" x="100" y="22">Browser Mic</text>
            <text class="node-sub"   x="100" y="42">WEBRTC · LOCAL TRACK</text>
          </g>

          <!-- ===== API edge column ===== -->
          <g transform="translate(255,70)" class="node-pulse violet">
            <rect class="node-bg violet" width="200" height="76" rx="12"/>
            <text class="node-label" x="100" y="26">FastAPI Backend</text>
            <text class="node-sub"   x="100" y="46">ASYNC · DI · SLOWAPI</text>
            <text class="node-tag"   x="100" y="62">/api/v1/*</text>
          </g>
          <g transform="translate(255,180)">
            <rect class="node-bg sky" width="200" height="60" rx="10"/>
            <text class="node-label" x="100" y="22">WebSocket Hub</text>
            <text class="node-sub"   x="100" y="42">PER-MEETING FAN-OUT</text>
          </g>
          <g transform="translate(255,270)">
            <rect class="node-bg violet" width="200" height="60" rx="10"/>
            <text class="node-label" x="100" y="22">Agent Dispatcher</text>
            <text class="node-sub"   x="100" y="42">5× PARALLEL · asyncio</text>
          </g>
          <g transform="translate(255,360)">
            <rect class="node-bg violet" width="200" height="60" rx="10"/>
            <text class="node-label" x="100" y="22">RAG · KG Endpoints</text>
            <text class="node-sub"   x="100" y="42">/documents/* · /query</text>
          </g>

          <!-- ===== Voice process column ===== -->
          <g transform="translate(495,70)">
            <rect class="node-bg amber" width="240" height="60" rx="10"/>
            <text class="node-label" x="120" y="22">LiveKit Server</text>
            <text class="node-sub"   x="120" y="42">WEBRTC SFU · meeting-{id}</text>
          </g>
          <g transform="translate(495,180)" class="node-pulse amber">
            <rect class="node-bg pink" width="240" height="76" rx="12"/>
            <text class="node-label" x="120" y="26">Meeting Voice Worker</text>
            <text class="node-sub"   x="120" y="46">SEPARATE PYTHON PROCESS</text>
            <text class="node-tag"   x="120" y="62">STT LOOP · TTS PUBLISH</text>
          </g>
          <g transform="translate(495,300)">
            <rect class="node-bg pink" width="240" height="60" rx="10"/>
            <text class="node-label" x="120" y="22">Deepgram nova-3 STT</text>
            <text class="node-sub"   x="120" y="42">RECONNECT · 1s → 15s BACKOFF</text>
          </g>
          <g transform="translate(495,390)">
            <rect class="node-bg pink" width="240" height="60" rx="10"/>
            <text class="node-label" x="120" y="22">Cartesia sonic-2 TTS</text>
            <text class="node-sub"   x="120" y="42">pcm_s16le · 24kHz</text>
          </g>

          <!-- ===== Data / external column ===== -->
          <g transform="translate(775,70)">
            <rect class="node-bg emerald" width="170" height="58" rx="10"/>
            <text class="node-label" x="85" y="22">PostgreSQL</text>
            <text class="node-sub"   x="85" y="42">SYSTEM OF RECORD</text>
          </g>
          <g transform="translate(960,70)">
            <rect class="node-bg emerald" width="170" height="58" rx="10"/>
            <text class="node-label" x="85" y="22">Qdrant</text>
            <text class="node-sub"   x="85" y="42">3-LEVEL VECTORS</text>
          </g>
          <g transform="translate(775,150)">
            <rect class="node-bg emerald" width="170" height="58" rx="10"/>
            <text class="node-label" x="85" y="22">Neo4j</text>
            <text class="node-sub"   x="85" y="42">KNOWLEDGE GRAPH</text>
          </g>
          <g transform="translate(960,150)">
            <rect class="node-bg emerald" width="170" height="58" rx="10"/>
            <text class="node-label" x="85" y="22">Redis</text>
            <text class="node-sub"   x="85" y="42">CACHE · PUB/SUB</text>
          </g>
          <g transform="translate(775,230)">
            <rect class="node-bg emerald" width="170" height="58" rx="10"/>
            <text class="node-label" x="85" y="22">MinIO</text>
            <text class="node-sub"   x="85" y="42">FILE STORAGE</text>
          </g>

          <g transform="translate(775,330)">
            <rect class="node-bg amber" width="170" height="58" rx="10"/>
            <text class="node-label" x="85" y="22">OpenAI</text>
            <text class="node-sub"   x="85" y="42">GPT-4 · EMBEDDINGS</text>
          </g>
          <g transform="translate(960,330)">
            <rect class="node-bg amber" width="170" height="58" rx="10"/>
            <text class="node-label" x="85" y="22">Exa</text>
            <text class="node-sub"   x="85" y="42">SEMANTIC WEB SEARCH</text>
          </g>
          <g transform="translate(775,410)">
            <rect class="node-bg amber" width="170" height="58" rx="10"/>
            <text class="node-label" x="85" y="22">Postmark</text>
            <text class="node-sub"   x="85" y="42">EMAIL DELIVERY</text>
          </g>

          <!-- ===== Edges: Client → API ===== -->
          <path d="M220 100 C 240 100 240 100 255 100" class="edge flow accent" marker-end="url(#arr-violet)"/>
          <text x="237" y="93" class="edge-label">REST</text>

          <path d="M220 210 C 240 210 240 210 255 210" class="edge flow sky dashed"/>
          <text x="237" y="203" class="edge-label">WS</text>

          <!-- Client → LiveKit (audio) -->
          <path d="M220 190 C 360 190 380 100 495 100" class="edge flow amber" marker-end="url(#arr-amber)"/>
          <text x="370" y="135" class="edge-label">WEBRTC</text>

          <!-- LiveKit ↔ Worker -->
          <path d="M615 130 L 615 180" class="edge flow amber" marker-end="url(#arr-amber)"/>
          <path d="M620 256 L 620 130" class="edge flow amber dashed" opacity=".7"/>

          <!-- Worker → Deepgram -->
          <path d="M615 256 L 615 300" class="edge flow pink" marker-end="url(#arr-pink)"/>
          <!-- Worker → Cartesia -->
          <path d="M615 256 C 615 320 615 360 615 390" class="edge flow pink" marker-end="url(#arr-pink)"/>

          <!-- Worker → API (utterances POST) -->
          <path d="M495 210 C 480 210 470 100 455 100" class="edge flow" marker-end="url(#arr)"/>
          <text x="475" y="148" class="edge-label">POST</text>

          <!-- Redis pub/sub: API → Worker -->
          <path d="M960 180 C 760 180 700 240 615 256" class="edge flow sky dashed" opacity=".6"/>
          <text x="780" y="265" class="edge-label">speak pubsub</text>

          <!-- API → Postgres -->
          <path d="M455 110 C 600 110 700 99 775 99" class="edge flow" marker-end="url(#arr)"/>
          <!-- API → Qdrant -->
          <path d="M455 380 C 700 380 800 99 960 99" class="edge flow" marker-end="url(#arr)" opacity=".7"/>
          <!-- API → Neo4j -->
          <path d="M455 380 C 700 380 720 179 775 179" class="edge flow" marker-end="url(#arr)" opacity=".7"/>
          <!-- API → Redis -->
          <path d="M455 210 C 700 210 850 179 960 179" class="edge flow" marker-end="url(#arr)" opacity=".7"/>
          <!-- API → MinIO -->
          <path d="M455 380 C 660 380 720 259 775 259" class="edge flow" marker-end="url(#arr)" opacity=".7"/>
          <!-- API → OpenAI -->
          <path d="M455 300 C 600 300 720 359 775 359" class="edge flow amber" marker-end="url(#arr-amber)"/>
          <!-- API → Exa -->
          <path d="M455 390 C 700 390 850 359 960 359" class="edge flow amber" marker-end="url(#arr-amber)"/>
          <!-- API → Postmark -->
          <path d="M455 390 C 600 390 720 439 775 439" class="edge flow amber" marker-end="url(#arr-amber)"/>

          <!-- ===== Animated flow dots (the centerpiece) ===== -->
          <circle r="3.5" fill="#8b5cf6" class="flow-dot"
                  style="color:#8b5cf6;offset-path:path('M220 100 C 240 100 240 100 255 100');animation:flowA 1.8s linear infinite"/>
          <circle r="3" fill="#0ea5e9" class="flow-dot"
                  style="color:#0ea5e9;offset-path:path('M255 210 L 220 210');animation:flowA 1.6s linear infinite .3s"/>
          <circle r="3" fill="#f59e0b" class="flow-dot"
                  style="color:#f59e0b;offset-path:path('M220 190 C 360 190 380 100 495 100');animation:flowA 2.6s linear infinite"/>
          <circle r="3.2" fill="#ec4899" class="flow-dot"
                  style="color:#ec4899;offset-path:path('M615 130 L 615 180');animation:flowA 1.4s linear infinite .2s"/>
          <circle r="3" fill="#ec4899" class="flow-dot"
                  style="color:#ec4899;offset-path:path('M615 256 L 615 300');animation:flowA 1.6s linear infinite .6s"/>
          <circle r="3" fill="#5c6788" class="flow-dot"
                  style="color:#5c6788;offset-path:path('M495 210 C 480 210 470 100 455 100');animation:flowA 2.4s linear infinite 1s"/>
          <circle r="3" fill="#0ea5e9" class="flow-dot"
                  style="color:#0ea5e9;offset-path:path('M960 180 C 760 180 700 240 615 256');animation:flowA 3.2s linear infinite 1.4s"/>

          <text x="570" y="520" class="node-sub" text-anchor="middle" opacity=".7">
            Worker auto-joins meeting-* rooms · API never touches audio · Redis pubsub bridges API → Worker for TTS
          </text>
        </svg>
