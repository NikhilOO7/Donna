<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="1140" height="500" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="#0a0f1c"/>
  <style>
.node-bg{fill:#1a2336;stroke:#2b3654;stroke-width:1.2}
.node-bg.indigo{stroke:#6366f1;fill:#1b1d3a}
.node-bg.violet{stroke:#8b5cf6;fill:#221a3a}
.node-bg.amber{stroke:#f59e0b;fill:#2c2418}
.node-bg.emerald{stroke:#10b981;fill:#152a23}
.node-bg.pink{stroke:#ec4899;fill:#2a1a26}
.node-bg.sky{stroke:#0ea5e9;fill:#15273a}
.node-bg.rose{stroke:#f43f5e;fill:#2a1820}
.node-bg.green{stroke:#22c55e;fill:#152a22}
.node-label{fill:#eaeef4;font:600 12.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}
.node-sub{fill:#8a93ab;font:10.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.06em}
.node-tag{fill:#cbd5e1;font:700 9.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.12em;text-transform:uppercase}
.edge{fill:none;stroke:#3a4258;stroke-width:1.4}
.edge.dashed{stroke-dasharray:5 5}
.edge.flow{stroke:#5c6788}
.edge.accent{stroke:#8b5cf6}
.edge.amber{stroke:#f59e0b}
.edge.pink{stroke:#ec4899}
.edge.emerald{stroke:#10b981}
.edge.sky{stroke:#0ea5e9}
.edge-label{fill:#9ca3b8;font:10.5px ui-monospace,SFMono-Regular,monospace;text-anchor:middle;letter-spacing:.04em}
.lane-label{fill:#6b7390;font:700 10.5px Inter,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-anchor:middle}
@keyframes flowA{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes nodePulse{0%,100%{filter:drop-shadow(0 0 0 rgba(99,102,241,0))}50%{filter:drop-shadow(0 0 8px rgba(99,102,241,.55))}}
@keyframes nodePulseViolet{0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0))}50%{filter:drop-shadow(0 0 8px rgba(139,92,246,.55))}}
@keyframes nodePulseAmber{0%,100%{filter:drop-shadow(0 0 0 rgba(245,158,11,0))}50%{filter:drop-shadow(0 0 8px rgba(245,158,11,.55))}}
@keyframes nodePulseEmerald{0%,100%{filter:drop-shadow(0 0 0 rgba(16,185,129,0))}50%{filter:drop-shadow(0 0 8px rgba(16,185,129,.55))}}
.node-pulse{animation:nodePulse 2.6s ease-in-out infinite}
.node-pulse.violet{animation-name:nodePulseViolet}
.node-pulse.amber{animation-name:nodePulseAmber}
.node-pulse.emerald{animation-name:nodePulseEmerald}
.flow-dot{filter:drop-shadow(0 0 4px currentColor)}
</style>
          <defs>
            <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6788"/></marker>
            <marker id="ma-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
            <marker id="ma-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
          </defs>

          <text x="200" y="28" class="lane-label">MEMORY STORES</text>
          <text x="940" y="28" class="lane-label">AGENT READS</text>

          <line x1="570" y1="44" x2="570" y2="475" class="edge dashed" opacity=".3"/>

          <!-- ===== Left: Memory stores ===== -->
          <!-- Working memory: transcript (centered) -->
          <g transform="translate(80,80)" class="node-pulse emerald">
            <rect class="node-bg emerald" width="380" height="86" rx="14"/>
            <text class="node-tag"   x="190" y="18" style="fill:#34d399">WORKING MEMORY · HOT</text>
            <text class="node-label" x="190" y="42">📝 MeetingTranscript</text>
            <text class="node-sub"   x="190" y="62">POSTGRESQL · JSONB · ROLLING WINDOW</text>
            <text class="node-tag"   x="190" y="78">UPDATES EVERY UTTERANCE</text>
          </g>

          <!-- Long-term stores -->
          <g transform="translate(80,200)">
            <rect class="node-bg emerald" width="180" height="76" rx="10"/>
            <text class="node-tag"   x="90" y="14" style="fill:#34d399">LONG TERM</text>
            <text class="node-label" x="90" y="36">🔬 ResearchBrief</text>
            <text class="node-sub"   x="90" y="55">PER-MEETING</text>
            <text class="node-tag"   x="90" y="69">TOPICS · SOURCES</text>
          </g>
          <g transform="translate(280,200)">
            <rect class="node-bg emerald" width="180" height="76" rx="10"/>
            <text class="node-tag"   x="90" y="14" style="fill:#34d399">LONG TERM</text>
            <text class="node-label" x="90" y="36">🔎 Qdrant</text>
            <text class="node-sub"   x="90" y="55">VECTOR STORE</text>
            <text class="node-tag"   x="90" y="69">3-LEVEL EMBEDDINGS</text>
          </g>
          <g transform="translate(180,310)">
            <rect class="node-bg emerald" width="280" height="76" rx="10"/>
            <text class="node-tag"   x="140" y="14" style="fill:#34d399">LONG TERM · GRAPH</text>
            <text class="node-label" x="140" y="36">🧠 Neo4j</text>
            <text class="node-sub"   x="140" y="55">ENTITIES + RELATIONSHIPS</text>
            <text class="node-tag"   x="140" y="69">FROM KB DOCUMENTS</text>
          </g>

          <!-- ===== Right: Agents (5 stacked) ===== -->
          <g transform="translate(770,60)">
            <rect class="node-bg amber" width="240" height="48" rx="10"/>
            <text class="node-label" x="120" y="20">✍️ Scribe</text>
            <text class="node-sub"   x="120" y="38">LAST 5 UTTERANCES · DECISIONS</text>
          </g>
          <g transform="translate(770,118)">
            <rect class="node-bg amber" width="240" height="48" rx="10"/>
            <text class="node-label" x="120" y="20">📚 Context (RAG)</text>
            <text class="node-sub"   x="120" y="38">LAST 3 · MULTI-MODAL RE-RANK</text>
          </g>
          <g transform="translate(770,176)">
            <rect class="node-bg amber" width="240" height="48" rx="10"/>
            <text class="node-label" x="120" y="20">💡 Insight</text>
            <text class="node-sub"   x="120" y="38">LAST 5 · MATCH ↔ RESEARCH</text>
          </g>
          <g transform="translate(770,234)">
            <rect class="node-bg amber" width="240" height="48" rx="10"/>
            <text class="node-label" x="120" y="20">🛡 Fact-Check</text>
            <text class="node-sub"   x="120" y="38">LATEST · EXA SOURCES</text>
          </g>
          <g transform="translate(770,292)" class="node-pulse amber">
            <rect class="node-bg amber" width="240" height="48" rx="10"/>
            <text class="node-label" x="120" y="20">🧠 KG-Query</text>
            <text class="node-sub"   x="120" y="38">LAST 3 · CYPHER TRAVERSAL</text>
          </g>

          <!-- ===== Edges: every agent reads transcript ===== -->
          <path d="M460 110 C 600 110 670 84 770 84"   class="edge flow emerald" marker-end="url(#ma-e)"/>
          <path d="M460 120 C 600 120 670 142 770 142" class="edge flow emerald" marker-end="url(#ma-e)"/>
          <path d="M460 130 C 600 130 670 200 770 200" class="edge flow emerald" marker-end="url(#ma-e)"/>
          <path d="M460 140 C 600 140 670 258 770 258" class="edge flow emerald" marker-end="url(#ma-e)"/>
          <path d="M460 150 C 600 150 670 316 770 316" class="edge flow emerald" marker-end="url(#ma-e)"/>

          <!-- Edges: agent-specific reads -->
          <!-- ResearchBrief → Insight -->
          <path d="M260 220 C 500 220 670 200 770 200" class="edge flow amber dashed" opacity=".75"/>
          <text x="495" y="210" class="edge-label" style="fill:#f59e0b">topics · sources</text>
          <!-- Qdrant → Context -->
          <path d="M460 220 C 600 220 670 142 770 142" class="edge flow amber" marker-end="url(#ma-a)"/>
          <text x="610" y="180" class="edge-label" style="fill:#f59e0b">embeddings</text>
          <!-- Neo4j → KGQuery -->
          <path d="M460 340 C 620 340 700 316 770 316" class="edge flow amber" marker-end="url(#ma-a)"/>
          <text x="555" y="330" class="edge-label" style="fill:#f59e0b">cypher MATCH path</text>

          <!-- Note about write-back direction -->
          <g transform="translate(80,440)">
            <rect class="node-bg" width="900" height="40" rx="8" opacity=".5"/>
            <text x="450" y="24" class="node-sub" text-anchor="middle">
              Every utterance writes to the transcript; agent OUTPUTS (nudges) flow forward into PostgreSQL `nudges` — not back into memory
            </text>
          </g>

          <!-- Animated dots: pulse through the read paths -->
          <circle r="3" fill="#10b981" class="flow-dot" style="color:#10b981;offset-path:path('M460 110 C 600 110 670 84 770 84');animation:flowA 2.0s linear infinite"/>
          <circle r="3" fill="#10b981" class="flow-dot" style="color:#10b981;offset-path:path('M460 120 C 600 120 670 142 770 142');animation:flowA 2.0s linear infinite .15s"/>
          <circle r="3" fill="#10b981" class="flow-dot" style="color:#10b981;offset-path:path('M460 130 C 600 130 670 200 770 200');animation:flowA 2.0s linear infinite .3s"/>
          <circle r="3" fill="#10b981" class="flow-dot" style="color:#10b981;offset-path:path('M460 140 C 600 140 670 258 770 258');animation:flowA 2.0s linear infinite .45s"/>
          <circle r="3" fill="#10b981" class="flow-dot" style="color:#10b981;offset-path:path('M460 150 C 600 150 670 316 770 316');animation:flowA 2.0s linear infinite .6s"/>
          <circle r="3" fill="#f59e0b" class="flow-dot" style="color:#f59e0b;offset-path:path('M460 220 C 600 220 670 142 770 142');animation:flowA 2.2s linear infinite .8s"/>
          <circle r="3" fill="#f59e0b" class="flow-dot" style="color:#f59e0b;offset-path:path('M460 340 C 620 340 700 316 770 316');animation:flowA 2.2s linear infinite 1.0s"/>
        </svg>
