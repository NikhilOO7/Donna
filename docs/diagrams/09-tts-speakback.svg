<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 380" width="1140" height="380" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="#0a0f1c"/>
  <style>
.node-bg{fill:#1a2336;stroke:#2b3654;stroke-width:1.2}
.node-bg.indigo{stroke:#6366f1;fill:#1b1d3a}
.node-bg.violet{stroke:#8b5cf6;fill:#221a3a}
.node-bg.amber{stroke:#f59e0b;fill:#2c2418}
.node-bg.emerald{stroke:#10b981;fill:#152a23}
.node-bg.pink{stroke:#ec4899;fill:#2a1a26}
.node-bg.sky{stroke:#0ea5e9;fill:#15273a}
.node-bg.rose{stroke:#f43f5e;fill:#2a1820}
.node-bg.green{stroke:#22c55e;fill:#152a22}
.node-label{fill:#eaeef4;font:600 12.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}
.node-sub{fill:#8a93ab;font:10.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.06em}
.node-tag{fill:#cbd5e1;font:700 9.5px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.12em;text-transform:uppercase}
.edge{fill:none;stroke:#3a4258;stroke-width:1.4}
.edge.dashed{stroke-dasharray:5 5}
.edge.flow{stroke:#5c6788}
.edge.accent{stroke:#8b5cf6}
.edge.amber{stroke:#f59e0b}
.edge.pink{stroke:#ec4899}
.edge.emerald{stroke:#10b981}
.edge.sky{stroke:#0ea5e9}
.edge-label{fill:#9ca3b8;font:10.5px ui-monospace,SFMono-Regular,monospace;text-anchor:middle;letter-spacing:.04em}
.lane-label{fill:#6b7390;font:700 10.5px Inter,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-anchor:middle}
@keyframes flowA{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes nodePulse{0%,100%{filter:drop-shadow(0 0 0 rgba(99,102,241,0))}50%{filter:drop-shadow(0 0 8px rgba(99,102,241,.55))}}
@keyframes nodePulseViolet{0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0))}50%{filter:drop-shadow(0 0 8px rgba(139,92,246,.55))}}
@keyframes nodePulseAmber{0%,100%{filter:drop-shadow(0 0 0 rgba(245,158,11,0))}50%{filter:drop-shadow(0 0 8px rgba(245,158,11,.55))}}
@keyframes nodePulseEmerald{0%,100%{filter:drop-shadow(0 0 0 rgba(16,185,129,0))}50%{filter:drop-shadow(0 0 8px rgba(16,185,129,.55))}}
.node-pulse{animation:nodePulse 2.6s ease-in-out infinite}
.node-pulse.violet{animation-name:nodePulseViolet}
.node-pulse.amber{animation-name:nodePulseAmber}
.node-pulse.emerald{animation-name:nodePulseEmerald}
.flow-dot{filter:drop-shadow(0 0 4px currentColor)}
</style>
          <defs>
            <marker id="tta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6788"/></marker>
            <marker id="tta-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
            <marker id="tta-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
            <marker id="tta-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/></marker>
            <marker id="tta-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
          </defs>

          <text x="120" y="28" class="lane-label">BACKEND</text>
          <text x="430" y="28" class="lane-label">REDIS IPC</text>
          <text x="700" y="28" class="lane-label">VOICE WORKER</text>
          <text x="1010" y="28" class="lane-label">LIVEKIT ROOM</text>

          <line x1="290" y1="44" x2="290" y2="345" class="edge dashed" opacity=".3"/>
          <line x1="560" y1="44" x2="560" y2="345" class="edge dashed" opacity=".3"/>
          <line x1="900" y1="44" x2="900" y2="345" class="edge dashed" opacity=".3"/>

          <!-- ===== User trigger ===== -->
          <g transform="translate(50,80)">
            <rect class="node-bg indigo" width="220" height="60" rx="10"/>
            <text class="node-label" x="110" y="22">👤 User or backend</text>
            <text class="node-sub"   x="110" y="42">TRIGGERS AI SPEECH</text>
          </g>

          <!-- ===== Backend endpoint ===== -->
          <g transform="translate(50,180)" class="node-pulse violet">
            <rect class="node-bg violet" width="220" height="60" rx="10"/>
            <text class="node-label" x="110" y="22">POST /speak</text>
            <text class="node-sub"   x="110" y="42">{ text }</text>
          </g>
          <path d="M160 140 L 160 180" class="edge flow accent" marker-end="url(#tta-v)"/>

          <!-- ===== Redis IPC ===== -->
          <g transform="translate(310,180)" class="node-pulse">
            <rect class="node-bg sky" width="230" height="60" rx="10"/>
            <text class="node-label" x="115" y="22">🔊 Redis PUBLISH</text>
            <text class="node-sub"   x="115" y="42">meeting:id:speak</text>
          </g>
          <path d="M270 210 L 310 210" class="edge flow sky" marker-end="url(#tta-s)"/>

          <!-- API → User response -->
          <path d="M270 195 C 260 240 200 240 160 240" class="edge flow dashed" opacity=".5"/>
          <text x="200" y="265" class="edge-label">200 OK · subscribers count</text>

          <!-- ===== Worker subscriber ===== -->
          <g transform="translate(590,180)" class="node-pulse">
            <rect class="node-bg pink" width="230" height="60" rx="10"/>
            <text class="node-label" x="115" y="22">📡 Pub/sub listener</text>
            <text class="node-sub"   x="115" y="42">PER-ROOM TASK</text>
          </g>
          <path d="M540 210 L 590 210" class="edge flow sky" marker-end="url(#tta-s)"/>

          <!-- ===== Cartesia synthesis ===== -->
          <g transform="translate(590,80)">
            <rect class="node-bg pink" width="230" height="68" rx="10"/>
            <text class="node-label" x="115" y="22">🗣 Cartesia sonic-2</text>
            <text class="node-sub"   x="115" y="42">model=sonic-2 · pcm_s16le</text>
            <text class="node-tag"   x="115" y="60">24 kHz MONO</text>
          </g>
          <path d="M705 180 L 705 148" class="edge flow pink" marker-end="url(#tta-p)"/>
          <text x="745" y="170" class="edge-label" style="fill:#ec4899">tts.bytes()</text>

          <!-- ===== Slice + capture ===== -->
          <g transform="translate(590,280)">
            <rect class="node-bg pink" width="230" height="50" rx="10"/>
            <text class="node-label" x="115" y="20">✂ Slice 20ms AudioFrames</text>
            <text class="node-sub"   x="115" y="38">480 SAMPLES @ 24kHz · CAPTURE</text>
          </g>
          <path d="M705 240 L 705 280" class="edge flow pink" marker-end="url(#tta-p)"/>

          <!-- ===== LiveKit room (publish + user hears) ===== -->
          <g transform="translate(930,80)">
            <rect class="node-bg amber" width="190" height="68" rx="10"/>
            <text class="node-label" x="95" y="22">🎙 LiveKit room</text>
            <text class="node-sub"   x="95" y="42">PUBLISHED TRACK:</text>
            <text class="node-tag"   x="95" y="60">meeting-assistant-voice</text>
          </g>
          <g transform="translate(930,280)" class="node-pulse amber">
            <rect class="node-bg amber" width="190" height="50" rx="10"/>
            <text class="node-label" x="95" y="20">🔊 User hears AI</text>
            <text class="node-sub"   x="95" y="38">VIA WEBRTC</text>
          </g>
          <path d="M820 305 L 930 305" class="edge flow amber" marker-end="url(#tta-a)"/>
          <text x="870" y="295" class="edge-label" style="fill:#f59e0b">capture_frame</text>

          <!-- LiveKit track → user (loop closure) -->
          <path d="M1025 148 L 1025 280" class="edge flow amber dashed" opacity=".7"/>

          <!-- Animated dots -->
          <circle r="3" fill="#8b5cf6" class="flow-dot" style="color:#8b5cf6;offset-path:path('M160 140 L 160 180');animation:flowA 1.0s linear infinite"/>
          <circle r="3" fill="#0ea5e9" class="flow-dot" style="color:#0ea5e9;offset-path:path('M270 210 L 310 210');animation:flowA 1.0s linear infinite .15s"/>
          <circle r="3" fill="#0ea5e9" class="flow-dot" style="color:#0ea5e9;offset-path:path('M540 210 L 590 210');animation:flowA 1.0s linear infinite .35s"/>
          <circle r="3" fill="#ec4899" class="flow-dot" style="color:#ec4899;offset-path:path('M705 180 L 705 148');animation:flowA 1.2s linear infinite .55s"/>
          <circle r="3" fill="#ec4899" class="flow-dot" style="color:#ec4899;offset-path:path('M705 240 L 705 280');animation:flowA 1.2s linear infinite .75s"/>
          <circle r="3" fill="#f59e0b" class="flow-dot" style="color:#f59e0b;offset-path:path('M820 305 L 930 305');animation:flowA 1.4s linear infinite .95s"/>
          <circle r="3" fill="#f59e0b" class="flow-dot" style="color:#f59e0b;offset-path:path('M1025 148 L 1025 280');animation:flowA 1.4s linear infinite 1.1s"/>

          <text x="570" y="370" class="node-sub" text-anchor="middle" opacity=".7">
            Backend doesn't know which worker holds the room · Redis pubsub decouples them · Worker already in the room publishes the TTS track on join
          </text>
        </svg>
