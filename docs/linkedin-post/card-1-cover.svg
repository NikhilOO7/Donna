<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
<rect width="100%" height="100%" class="bg" fill="#0a0f1c"/><style>
.bg{fill:#0a0f1c}
.tag{fill:#8b5cf6;font:700 26px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.25em}
.tag.amber{fill:#f59e0b}.tag.emerald{fill:#10b981}.tag.sky{fill:#0ea5e9}.tag.rose{fill:#f43f5e}.tag.pink{fill:#ec4899}
.h1{fill:#f1f5f9;font:800 56px 'Inter',-apple-system,'Helvetica Neue',sans-serif;letter-spacing:-.02em}
.hsub{fill:#94a3b8;font:400 27px 'Inter',-apple-system,sans-serif}
.nlabel{fill:#eaeef4;font:600 27px 'Inter',-apple-system,sans-serif;text-anchor:middle;dominant-baseline:middle}
.nsub{fill:#8a93ab;font:400 20.5px 'Inter',-apple-system,sans-serif;text-anchor:middle;dominant-baseline:middle}
.ntag{fill:#cbd5e1;font:700 16px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;text-anchor:middle;dominant-baseline:middle}
.lane{fill:#5b647e;font:700 19px 'Inter',-apple-system,sans-serif;letter-spacing:.22em;text-transform:uppercase;text-anchor:middle}
.box{fill:#131b2e;stroke:#2b3654;stroke-width:2.5}
.box.rose{stroke:#f43f5e;fill:#1c1219}.box.emerald{stroke:#10b981;fill:#0f2019}.box.violet{stroke:#8b5cf6;fill:#181231}
.box.amber{stroke:#f59e0b;fill:#211a0e}.box.sky{stroke:#0ea5e9;fill:#0e1d2b}.box.pink{stroke:#ec4899;fill:#1f1119}
.box.indigo{stroke:#6366f1;fill:#161a38}.box.cyan{stroke:#06b6d4;fill:#0d2126}
.edge{fill:none;stroke:#5c6788;stroke-width:3}
.edge.dashed{stroke-dasharray:9 8}
.edge.rose{stroke:#f43f5e}.edge.emerald{stroke:#10b981}.edge.amber{stroke:#f59e0b}
.edge.violet{stroke:#8b5cf6}.edge.sky{stroke:#0ea5e9}.edge.pink{stroke:#ec4899}
.elabel{fill:#9ca3b8;font:500 19px 'JetBrains Mono',ui-monospace,monospace;text-anchor:middle}
.mono{fill:#a5b4fc;font:500 24px 'JetBrains Mono',ui-monospace,monospace}
.mono.red{fill:#f87171}.mono.green{fill:#6ee7b7}
.tolabel{fill:#f59e0b;font:700 21px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.2em}
.tobody{fill:#cbd5e1;font:500 27px 'Inter',-apple-system,sans-serif}
.footer{fill:#475569;font:500 22px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.12em}
text[text-anchor="start"]{text-anchor:start}text[text-anchor="end"]{text-anchor:end}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6788"/></marker>
<marker id="ar-e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
<marker id="ar-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
<marker id="ar-v" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
<marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="ar-s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
<marker id="ar-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/></marker>
</defs>
<radialGradient id="glow" cx="85%" cy="6%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".14"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<rect width="100%" height="100%" fill="url(#glow)"/>

<text x="70" y="140" class="tag" text-anchor="start">AI INFRA · FIELD NOTES</text>
<text x="70" y="248" class="h1" text-anchor="start">5 lessons from building</text>
<text x="70" y="318" class="h1" text-anchor="start">a 19-agent AI system</text>
<text x="70" y="378" class="hsub" text-anchor="start">the architecture, the decisions, and the trade-offs behind them</text>

<g transform="translate(70,440)"><rect class="box indigo" width="940" height="70" rx="16"/><text class="nlabel" x="470" y="26" style="font-size:25px">Next.js 14 client</text><text class="nsub" x="470" y="52">REST + JWT · WebSocket · WebRTC mic</text></g>
<path class="edge" d="M330,510 V556" marker-end="url(#ar)"/>
<path class="edge sky" d="M800,510 V556" marker-end="url(#ar-s)"/>

<g transform="translate(70,558)"><rect class="box violet" width="560" height="210" rx="16"/><text class="nlabel" x="280" y="34" style="font-size:25px">FastAPI backend</text></g>
<g transform="translate(95,630)"><rect class="box rose" width="245" height="110" rx="16"/><text class="nlabel" x="122" y="34"><tspan style="font-size:24px">HOT · dispatcher</tspan></text><text class="nsub" x="122" y="66">9 agents / utterance</text><text class="ntag" x="122" y="88">streams · timeouts</text></g>
<g transform="translate(360,630)"><rect class="box amber" width="245" height="110" rx="16"/><text class="nlabel" x="122" y="34"><tspan style="font-size:24px">WARM · hub WS</tspan></text><text class="nsub" x="122" y="66">privacy @ socket</text><text class="ntag" x="122" y="88">&lt; 50ms fan-out</text></g>
<g transform="translate(670,558)"><rect class="box sky" width="340" height="100" rx="16"/><text class="nlabel" x="170" y="34"><tspan style="font-size:25px">LiveKit + voice-worker</tspan></text><text class="nsub" x="170" y="66">STT · TTS · barge-in</text></g>
<g transform="translate(670,678)"><rect class="box cyan" width="340" height="90" rx="16"/><text class="nlabel" x="170" y="34"><tspan style="font-size:25px">assistant + MCP</tspan></text><text class="nsub" x="170" y="66">voice chat · Donna-as-tools</text></g>
<path class="edge emerald" d="M668,608 H632" marker-end="url(#ar-e)"/>

<path class="edge pink" d="M200,768 V812" marker-end="url(#ar-p)"/>
<text x="216" y="798" class="elabel" text-anchor="start">Arq</text>
<g transform="translate(70,814)"><rect class="box pink" width="560" height="90" rx="16"/><text class="nlabel" x="280" y="34"><tspan style="font-size:25px">job-worker · COLD</tspan></text><text class="nsub" x="280" y="66">research · summary · docs · cron</text></g>
<g transform="translate(670,814)"><rect class="box " width="340" height="90" rx="16"/><text class="nlabel" x="170" y="34"><tspan style="font-size:25px">SaaS edge</tspan></text><text class="nsub" x="170" y="56" style="font-size:19px">OpenAI · Exa · Deepgram · …</text><text class="ntag" x="170" y="76" style="font-size:15px">circuit-broken · metered</text></g>

<path class="edge" d="M350,904 V928" marker-end="url(#ar)"/>
<g transform="translate(70,940)"><rect class="box emerald" width="172" height="74" rx="16"/><text class="nlabel" x="86" y="37"><tspan style="font-size:24px">Postgres</tspan></text></g><g transform="translate(262,940)"><rect class="box pink" width="172" height="74" rx="16"/><text class="nlabel" x="86" y="37"><tspan style="font-size:24px">Redis</tspan></text></g><g transform="translate(454,940)"><rect class="box indigo" width="172" height="74" rx="16"/><text class="nlabel" x="86" y="37"><tspan style="font-size:24px">Qdrant</tspan></text></g><g transform="translate(646,940)"><rect class="box violet" width="172" height="74" rx="16"/><text class="nlabel" x="86" y="37"><tspan style="font-size:24px">Neo4j</tspan></text></g><g transform="translate(838,940)"><rect class="box amber" width="172" height="74" rx="16"/><text class="nlabel" x="86" y="37"><tspan style="font-size:24px">MinIO</tspan></text></g>
<text x="540" y="1062" class="nsub" style="font-size:22px">five stores, picked by access pattern — rows · ephemera · vectors · edges · blobs</text>

<rect x="70" y="1130" width="6" height="80" fill="#8b5cf6"/>
<text x="100" y="1162" class="tobody" text-anchor="start" style="font-style:italic;fill:#c7d2fe">Route work by latency budget: hot / warm / cold.</text>
<text x="100" y="1202" class="tobody" text-anchor="start" style="font-style:italic;fill:#c7d2fe">Everything else in this system falls out of that decision.</text>
<text x="70" y="1310" class="footer" text-anchor="start">BUILDING DONNA — AI MEETING COLLABORATOR</text><text x="1010" y="1310" class="footer" text-anchor="end">1/6</text>
</svg>