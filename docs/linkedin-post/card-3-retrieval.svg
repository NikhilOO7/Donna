<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
<rect width="100%" height="100%" class="bg" fill="#0a0f1c"/><style>
.bg{fill:#0a0f1c}
.tag{fill:#8b5cf6;font:700 26px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.25em}
.tag.amber{fill:#f59e0b}.tag.emerald{fill:#10b981}.tag.sky{fill:#0ea5e9}.tag.rose{fill:#f43f5e}.tag.pink{fill:#ec4899}
.h1{fill:#f1f5f9;font:800 56px 'Inter',-apple-system,'Helvetica Neue',sans-serif;letter-spacing:-.02em}
.hsub{fill:#94a3b8;font:400 27px 'Inter',-apple-system,sans-serif}
.nlabel{fill:#eaeef4;font:600 27px 'Inter',-apple-system,sans-serif;text-anchor:middle;dominant-baseline:middle}
.nsub{fill:#8a93ab;font:400 20.5px 'Inter',-apple-system,sans-serif;text-anchor:middle;dominant-baseline:middle}
.ntag{fill:#cbd5e1;font:700 16px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;text-anchor:middle;dominant-baseline:middle}
.lane{fill:#5b647e;font:700 19px 'Inter',-apple-system,sans-serif;letter-spacing:.22em;text-transform:uppercase;text-anchor:middle}
.box{fill:#131b2e;stroke:#2b3654;stroke-width:2.5}
.box.rose{stroke:#f43f5e;fill:#1c1219}.box.emerald{stroke:#10b981;fill:#0f2019}.box.violet{stroke:#8b5cf6;fill:#181231}
.box.amber{stroke:#f59e0b;fill:#211a0e}.box.sky{stroke:#0ea5e9;fill:#0e1d2b}.box.pink{stroke:#ec4899;fill:#1f1119}
.box.indigo{stroke:#6366f1;fill:#161a38}.box.cyan{stroke:#06b6d4;fill:#0d2126}
.edge{fill:none;stroke:#5c6788;stroke-width:3}
.edge.dashed{stroke-dasharray:9 8}
.edge.rose{stroke:#f43f5e}.edge.emerald{stroke:#10b981}.edge.amber{stroke:#f59e0b}
.edge.violet{stroke:#8b5cf6}.edge.sky{stroke:#0ea5e9}.edge.pink{stroke:#ec4899}
.elabel{fill:#9ca3b8;font:500 19px 'JetBrains Mono',ui-monospace,monospace;text-anchor:middle}
.mono{fill:#a5b4fc;font:500 24px 'JetBrains Mono',ui-monospace,monospace}
.mono.red{fill:#f87171}.mono.green{fill:#6ee7b7}
.tolabel{fill:#f59e0b;font:700 21px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.2em}
.tobody{fill:#cbd5e1;font:500 27px 'Inter',-apple-system,sans-serif}
.footer{fill:#475569;font:500 22px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.12em}
text[text-anchor="start"]{text-anchor:start}text[text-anchor="end"]{text-anchor:end}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6788"/></marker>
<marker id="ar-e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
<marker id="ar-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
<marker id="ar-v" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
<marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="ar-s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
<marker id="ar-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec4899"/></marker>
</defs>
<radialGradient id="glow" cx="85%" cy="6%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".14"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<rect width="100%" height="100%" fill="url(#glow)"/>

<text x="70" y="140" class="tag sky" text-anchor="start">LESSON 02 · MEASURE RETRIEVAL</text>
<text x="70" y="240" class="h1" text-anchor="start">Fuse, do not choose</text>

<g transform="translate(70,310)"><rect class="box indigo" width="250" height="100" rx="16"/><text class="nlabel" x="125" y="34"><tspan style="font-size:25px">query</tspan></text><text class="nsub" x="125" y="66">+ conversation context</text></g>
<path class="edge sky" d="M320,340 C380,320 380,280 440,268" marker-end="url(#ar-s)"/>
<path class="edge amber" d="M320,380 C380,400 380,440 440,452" marker-end="url(#ar-a)"/>
<g transform="translate(442,228)"><rect class="box sky" width="300" height="86" rx="16"/><text class="nlabel" x="150" y="34"><tspan style="font-size:24px">dense · contextual</tspan></text><text class="nsub" x="150" y="66">embeddings, cached 24h</text></g>
<g transform="translate(442,412)"><rect class="box amber" width="300" height="86" rx="16"/><text class="nlabel" x="150" y="34"><tspan style="font-size:24px">lexical · BM25</tspan></text><text class="nsub" x="150" y="66">exact terms still matter</text></g>
<path class="edge sky" d="M742,271 C800,280 800,320 830,334" marker-end="url(#ar-s)"/>
<path class="edge amber" d="M742,455 C800,446 800,406 830,392" marker-end="url(#ar-a)"/>
<g transform="translate(832,316)"><rect class="box emerald" width="178" height="96" rx="16"/><text class="nlabel" x="89" y="26"><tspan style="font-size:24px">RRF fuse</tspan></text><text class="nsub" x="89" y="52">+ re-rank</text><text class="ntag" x="89" y="76">owner-filtered</text></g>

<text x="70" y="560" class="lane" text-anchor="start" style="letter-spacing:.14em">MRR · SAME MODEL, SAME QUERIES — ONLY THE STRATEGY DIFFERS</text>
<text x="70" y="610" class="nsub" text-anchor="start" style="font-size:23px;fill:#cbd5e1">naive dense RAG (baseline)</text><rect x="70" y="624" width="523" height="44" rx="9" fill="#475569"/><text x="613" y="656" class="nlabel" text-anchor="start" style="font-size:30px">0.845</text>
<text x="70" y="720" class="nsub" text-anchor="start" style="font-size:23px;fill:#cbd5e1">contextual embeddings ALONE 🤯</text><rect x="70" y="734" width="359" height="44" rx="9" fill="#f43f5e"/><text x="449" y="766" class="nlabel" text-anchor="start" style="font-size:30px">0.580</text>
<text x="70" y="830" class="nsub" text-anchor="start" style="font-size:23px;fill:#cbd5e1">contextual + BM25 hybrid (shipped)</text><rect x="70" y="844" width="575" height="44" rx="9" fill="#10b981"/><text x="665" y="876" class="nlabel" text-anchor="start" style="font-size:30px">0.929</text>
<text x="70" y="960" class="nsub" text-anchor="start" style="font-size:23px;fill:#cbd5e1">context enriches meaning — but homogenizes vectors within a document.</text>
<text x="70" y="994" class="nsub" text-anchor="start" style="font-size:23px;fill:#cbd5e1">+9.9% MRR · +15.8% recall@1 over naive — and the lift is a CI gate now.</text>
<rect x="70" y="1040" width="940" height="126" rx="16" fill="#151109" stroke="#f59e0b" stroke-width="2"/><text x="100" y="1078" class="tolabel" text-anchor="start">⚖ THE TRADE-OFF</text><text x="100" y="1116" class="tobody" text-anchor="start">Two index paths to maintain instead of one — bought: the fancy</text><text x="100" y="1152" class="tobody" text-anchor="start">technique upside without shipping its measured downside.</text>
<text x="70" y="1310" class="footer" text-anchor="start">BUILDING DONNA — AI MEETING COLLABORATOR</text><text x="1010" y="1310" class="footer" text-anchor="end">3/6</text>
</svg>