<g transform="translate(70,430)"><rect class="box " width="300" height="100" rx="16"/><text class="nlabel" x="150" y="26"><tspan style="font-size:24px">redis lock · wait=False</tspan></text><text class="nsub" x="150" y="56">busy → pending flag</text><text class="ntag" x="150" y="80">bursts coalesce, max 3</text></g>
