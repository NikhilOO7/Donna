x="12"/><text class="nlabel" x="20" y="27" text-anchor="start" style="font-size:23px">insight</text><text class="ntag" x="290" y="27" text-anchor="end" style="font-size:17px">≤ 12s</text></g><g transform="translate(700,858)"><rect class="box amber" width="310" height="54" rx="12"/><text class="nlabel" x="20" y="27" text-anchor="start" style="font-size:23px">fact-check</text><text class="ntag" x="290" y="27" text-anchor="end" style="font-size:17px">≤ 25s</text></g>
